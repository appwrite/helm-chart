{{- if .Values.networkPolicy.enabled }}
{{- /* Entry points: reachable from the configured sources and from this release. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "edge") }}
spec:
  podSelector:
    {{- include "appwrite.networkPolicy.selector" (dict "root" . "components" (list "api" "console" "realtime")) | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - from:
        - {{- include "appwrite.networkPolicy.releasePeer" . | nindent 10 }}
    {{- if include "appwrite.builds.inCluster" . }}
    {{- /* Build Jobs download sources from the API and report back to it. */}}
    - ports:
        - port: http
      from:
        - {{- include "appwrite.networkPolicy.buildsPeer" . | nindent 10 }}
    {{- end }}
{{- end }}
