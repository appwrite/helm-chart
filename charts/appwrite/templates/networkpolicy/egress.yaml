{{- $np := .Values.networkPolicy }}
{{- if and $np.enabled $np.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "egress") }}
spec:
  podSelector:
    matchLabels:
      {{- include "appwrite.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $np.egress.dns | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - {{- include "appwrite.networkPolicy.releasePeer" . | nindent 10 }}
    {{- with $np.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
