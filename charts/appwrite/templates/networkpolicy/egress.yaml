{{- $np := .Values.networkPolicy }}
{{- if and $np.enabled $np.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "egress") }}
spec:
  podSelector:
    matchLabels:
      {{- include "appwrite.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $np.egress.dns | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- /* Not the browser: it loads user-supplied URLs, so browser-egress limits it to the API and public addresses. */}}
        - podSelector:
            matchLabels:
              {{- include "appwrite.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values: [browser]
    {{- with $np.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
