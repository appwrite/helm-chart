{{- if and .Values.networkPolicy.enabled .Values.compute.enabled }}
{{- /* The orchestrator: called by Appwrite to start builds, and by build pods to move artifacts. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "orchestrator") }}
spec:
  podSelector:
    {{- include "appwrite.networkPolicy.selector" (dict "root" . "components" (list "orchestrator")) | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      from:
        - {{- include "appwrite.networkPolicy.releasePeer" . | nindent 10 }}
        - {{- include "appwrite.networkPolicy.buildsPeer" . | nindent 10 }}
{{- end }}
