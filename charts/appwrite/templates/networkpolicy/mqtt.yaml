{{- if and .Values.networkPolicy.enabled .Values.mqtt.enabled }}
{{- /* MQTT clients connect from outside: same sources as the HTTP entry points. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "mqtt") }}
spec:
  podSelector:
    {{- include "appwrite.networkPolicy.selector" (dict "root" . "components" (list "mqtt")) | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: mqtt
        - port: mqtt-ws
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
