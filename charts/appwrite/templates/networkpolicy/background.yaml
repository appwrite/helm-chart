{{- if .Values.networkPolicy.enabled }}
{{- /* Workers and tasks serve nothing: deny all ingress. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "background") }}
spec:
  podSelector:
    matchLabels:
      {{- include "appwrite.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: appwrite/role
        operator: In
        values: [worker, task]
  policyTypes: [Ingress]
{{- end }}
