{{- if .Values.assistant.enabled }}
{{- /* Appwrite calls the assistant at the hard-coded http://appwrite-assistant:3003. */}}
apiVersion: v1
kind: Service
metadata:
  name: appwrite-assistant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appwrite.componentLabels" (dict "root" . "component" "assistant") | nindent 4 }}
  {{- with include "appwrite.annotations" (dict "root" .) | trim }}{{ . | nindent 2 }}{{ end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "appwrite.componentSelectorLabels" (dict "root" . "component" "assistant") | nindent 4 }}
{{- end }}
