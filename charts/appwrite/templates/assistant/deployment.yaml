{{- if .Values.assistant.enabled }}
{{- $v := .Values.assistant }}
{{- $env := list (dict "name" "_APP_ASSISTANT_OPENAI_API_KEY" "valueFrom" (include "appwrite.secretRef" (dict "root" . "existingSecret" $v.existingSecret "key" $v.secretKey "defaultKey" "openai-api-key") | fromYaml)) }}
{{- $handler := dict "tcpSocket" (dict "port" "http") }}
{{- $probes := dict "readinessProbe" (dict "enabled" true "periodSeconds" 10 "timeoutSeconds" 5) "livenessProbe" (dict "enabled" true "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 3) }}
{{- include "appwrite.deployment" (dict
  "root" .
  "component" "assistant"
  "values" $v
  "image" (include "appwrite.image" (dict "root" . "image" $v.image))
  "pullPolicy" $v.image.pullPolicy
  "env" (toYaml $env)
  "ports" (list (dict "name" "http" "containerPort" 3003 "protocol" "TCP"))
  "probes" (include "appwrite.probes" (dict "values" $probes "handler" $handler))
  "replicas" 1
  "volumeMounts" (toYaml (list (dict "name" "tmp" "mountPath" "/tmp")))
  "volumes" (toYaml (list (dict "name" "tmp" "emptyDir" dict)))
) }}
{{- end }}
