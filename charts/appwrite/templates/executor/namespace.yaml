{{- if and .Values.compute.enabled .Values.compute.executor.createNamespace }}
{{- /* Docker-in-Docker needs a privileged container, which no other Pod Security Standard admits. Only the executor runs here. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appwrite.executor.namespace" . }}
  labels:
    {{- include "appwrite.componentLabels" (dict "root" . "component" "executor") | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce-version: latest
  {{- with include "appwrite.annotations" (dict "root" .) | trim }}{{ . | nindent 2 }}{{ end }}
{{- end }}
