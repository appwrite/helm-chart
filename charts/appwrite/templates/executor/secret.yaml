{{- if and .Values.compute.enabled (not .Values.compute.executor.existingSecret) }}
{{- /* Pods can't read Secrets in other namespaces: the executor gets a copy of the credentials it needs. Validation requires compute.executor.existingSecret when they come from Secrets the chart can't read. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.componentName" (dict "root" . "component" "executor") }}
  namespace: {{ include "appwrite.executor.namespace" . }}
  labels:
    {{- include "appwrite.componentLabels" (dict "root" . "component" "executor") | nindent 4 }}
  {{- with include "appwrite.annotations" (dict "root" .) | trim }}{{ . | nindent 2 }}{{ end }}
type: Opaque
data:
  {{- include "appwrite.executor.secret.data" . | nindent 2 }}
{{- end }}
