{{- with .Values.appwrite.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.fullname" $ }}-env
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "appwrite.labels" $ | nindent 4 }}
  {{- with include "appwrite.annotations" (dict "root" $) | trim }}{{ . | nindent 2 }}{{ end }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
