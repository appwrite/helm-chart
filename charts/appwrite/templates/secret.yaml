{{- $data := include "appwrite.secret.data" . | fromYaml }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appwrite.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appwrite.labels" . | nindent 4 }}
  annotations:
    # Generated credentials must survive uninstalls: the encryption key and
    # database passwords are tied to data on persistent volumes.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
