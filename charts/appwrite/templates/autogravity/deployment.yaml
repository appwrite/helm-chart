{{- if .Values.autogravity.enabled }}
{{- $v := .Values.autogravity }}
{{- $handler := dict "tcpSocket" (dict "port" "http") }}
{{- $probes := dict "startupProbe" (dict "enabled" true "periodSeconds" 5 "failureThreshold" 60 "timeoutSeconds" 5) "readinessProbe" (dict "enabled" true "periodSeconds" 10 "timeoutSeconds" 5) "livenessProbe" (dict "enabled" true "periodSeconds" 20 "timeoutSeconds" 5 "failureThreshold" 3) }}
{{- include "appwrite.deployment" (dict
  "root" .
  "component" "autogravity"
  "values" $v
  "image" (include "appwrite.image" (dict "root" . "image" $v.image))
  "pullPolicy" $v.image.pullPolicy
  "env" (toYaml (list (dict "name" "MODEL_BACKEND" "value" $v.modelBackend)))
  "ports" (list (dict "name" "http" "containerPort" 8080 "protocol" "TCP"))
  "probes" (include "appwrite.probes" (dict "values" $probes "handler" $handler))
  "replicas" 1
  "volumeMounts" (toYaml (list (dict "name" "tmp" "mountPath" "/tmp")))
  "volumes" (toYaml (list (dict "name" "tmp" "emptyDir" dict)))
) }}
{{- end }}
