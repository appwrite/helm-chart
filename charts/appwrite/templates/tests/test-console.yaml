{{- if and .Values.tests.enabled .Values.console.enabled }}
{{- $host := include "appwrite.componentName" (dict "root" . "component" "console") }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "appwrite.fullname" . }}-test-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appwrite.componentLabels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with include "appwrite.imagePullSecrets" . | trim }}{{ . | nindent 2 }}{{ end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: console
      image: {{ include "appwrite.appwriteImage" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -eu
          curl -fsS --max-time 10 -o /dev/null -w "console: HTTP %{http_code}\n" "http://{{ $host }}:{{ .Values.console.service.port }}/"
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
{{- end }}
