{{- if and (include "appwrite.builds.inCluster" .) .Values.compute.builds.createNamespace }}
{{- /* Build pods run your build commands, possibly as root, so they can't pass the restricted profile. baseline still forbids privileged pods and host access. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "appwrite.builds.namespace" . }}
  labels:
    {{- include "appwrite.componentLabels" (dict "root" . "component" "build") | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/enforce-version: latest
  {{- with include "appwrite.annotations" (dict "root" .) | trim }}{{ . | nindent 2 }}{{ end }}
{{- end }}
