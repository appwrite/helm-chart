apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 2.3.2
appVersion: "2.7.4"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.7.4/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: fixed
      description: Appwrite 2.7.4 (`appVersion`), rebuilt on PHP 8.5.13 (`appwrite/base` 2.2.13), which fixes an OPcache bug that could make a worker reject every `DateTime` value (`must be of type DateTime, DateTime given`) until it restarted. It uses the same migration as 2.7.1–2.7.3, so the migrate Job changes no data on an install already on 2.7, and it adds no environment variables. The chart already ships `openruntimes/executor` 1.3.7, which 2.7.4 moves to.
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.7.4
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.12
    - name: browser
      image: docker.io/appwrite/browser:0.3.16
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:5.1.0
    - name: clickhouse
      image: docker.io/clickhouse/clickhouse-server:26.11.5-alpine
    - name: console
      image: docker.io/appwrite/new:1.2.181-self-hosted
    - name: database
      image: docker.io/appwrite/postgres:0.3.3
    - name: database-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    - name: dind
      image: docker.io/library/docker:29.10.1-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.4
    - name: executor
      image: docker.io/openruntimes/executor:1.3.7
    - name: exiftool
      image: ghcr.io/appwrite/exiftool:0.1.5
    - name: geo
      image: docker.io/appwrite/geo:0.3.10
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:5.1.0
    - name: redis
      image: docker.io/library/redis:7.4.12-alpine
    - name: redis-exporter
      image: docker.io/oliver006/redis_exporter:v1.98.0-alpine
    - name: s3
      image: docker.io/chrislusf/seaweedfs:4.55
  artifacthub.io/displayName: Appwrite
