apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 2.1.0
appVersion: "2.6.1"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.6.1/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: changed
      description: Appwrite 2.6.1, with console 1.2.97 and the orchestrator's jobs service and job sidecar 2.2.4. The console shows the Appwrite version (`VITE_APPWRITE_VERSION`).
    - kind: changed
      description: 'The browser is on by default (`browser.enabled`), since Sites are: it renders their preview screenshots. Without it, every site deployment logs "Screenshot capturing failed" and the console shows no preview.'
    - kind: changed
      description: The API's startup probe waits for the marker Appwrite 2.6 writes once it has created its core schema, so no traffic reaches a pod that would answer 500 until then.
    - kind: changed
      description: The built-in PostgreSQL gets a 1Gi `/dev/shm`, up from 256Mi, as in Appwrite's Docker install.
    - kind: changed
      description: The combined worker sizes its pools for 79 coroutines, up from 78, for the new `maintenance` queue.
    - kind: changed
      description: CI upgrades from the published chart 2.0.0 with default values.
    - kind: added
      description: ExifTool, on by default (`exiftool.enabled`), which removes location, camera and capture-time metadata from images uploaded to buckets with *Image metadata* stripping on (optional-components.md).
      links:
        - name: optional-components.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/optional-components.md#exiftool
    - kind: added
      description: 'The `maintenance` queue, which cleans up projects nobody used in the last 30 days: consumed by the combined worker, by `worker-maintenance` in `separate` mode, and in `grouped` mode by the group that lists it, or a `worker-maintenance` Deployment of its own when none does. With `tasks.scheduler.mode: separate`, a `scheduler-maintenance` task schedules it (architecture.md).'
      links:
        - name: architecture.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/architecture.md#worker-topologies
    - kind: added
      description: '`storage.s3.external.pathStyle` (`_APP_STORAGE_S3_PATH_STYLE`), for endpoints Appwrite 2.6 can''t tell are bucket addresses, such as a custom domain (storage.md). The built-in store always uses path-style requests.'
      links:
        - name: storage.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/storage.md#your-own-s3-store
    - kind: added
      description: Setup notes for Entire, the Git provider Appwrite 2.6 adds (integrations.md).
      links:
        - name: integrations.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/integrations.md#entire
    - kind: added
      description: Troubleshooting for site deployments whose screenshot fails.
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.6.1
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.11
    - name: browser
      image: docker.io/appwrite/browser:0.3.6
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:2.2.4
    - name: builtin
      image: docker.io/appwrite/postgres:0.1.0
    - name: builtin
      image: docker.io/library/redis:7.4.12-alpine
    - name: builtin
      image: docker.io/clickhouse/clickhouse-server:26.4.5-alpine
    - name: builtin
      image: docker.io/chrislusf/seaweedfs:4.51
    - name: builtin-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    - name: builtin-exporter
      image: docker.io/oliver006/redis_exporter:v1.96.0-alpine
    - name: console
      image: docker.io/appwrite/new:1.2.106-self-hosted
    - name: dind
      image: docker.io/library/docker:29.9.2-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.1
    - name: executor
      image: docker.io/openruntimes/executor:1.1.2
    - name: exiftool
      image: ghcr.io/appwrite/exiftool:0.1.0
    - name: geo
      image: docker.io/appwrite/geo:0.3.2
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:2.2.4
  artifacthub.io/displayName: Appwrite
