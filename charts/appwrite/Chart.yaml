apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 2.3.0
appVersion: "2.7.3"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.7.3/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: added
      description: '`compute.executor.maintenanceInterval` sets how often the executor''s maintenance pass removes idle runtimes (`OPR_EXECUTOR_MAINTENANCE_INTERVAL`, 3600 seconds by default, as before), so a lower interval frees their memory sooner.'
    - kind: security
      description: Appwrite 2.7.3 (`appVersion`), rebuilt on `appwrite/base` 2.2.12, which updates libpq to 18.7 and clears the Appwrite image's high PostgreSQL findings.
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.7.3
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.12
    - name: browser
      image: docker.io/appwrite/browser:0.3.13
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:5.1.0
    - name: clickhouse
      image: docker.io/clickhouse/clickhouse-server:26.8.36-alpine
    - name: console
      image: docker.io/appwrite/new:1.2.181-self-hosted
    - name: database
      image: docker.io/appwrite/postgres:0.2.1
    - name: database-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    - name: dind
      image: docker.io/library/docker:29.9.3-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.3
    - name: executor
      image: docker.io/openruntimes/executor:1.3.4
    - name: exiftool
      image: ghcr.io/appwrite/exiftool:0.1.2
    - name: geo
      image: docker.io/appwrite/geo:0.3.9
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:5.1.0
    - name: redis
      image: docker.io/library/redis:7.4.12-alpine
    - name: redis-exporter
      image: docker.io/oliver006/redis_exporter:v1.96.0-alpine
    - name: s3
      image: docker.io/chrislusf/seaweedfs:4.52
  artifacthub.io/displayName: Appwrite
