apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 0.1.0
appVersion: "2.3.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.3.0/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: added
      description: Appwrite 2.3.0 with the API, console, realtime, workers and tasks, passing the restricted Pod Security Standard
    - kind: added
      description: Built-in PostgreSQL, Redis and ClickHouse, or external services
    - kind: added
      description: Combined, separate and grouped worker topologies
    - kind: added
      description: Ingress and Gateway API routes, including function and site previews and custom domains
    - kind: added
      description: S3 storage, and Functions and Sites in the cluster, with builds as Kubernetes Jobs and the executor on Docker-in-Docker in its own namespace (opt-in privileged pod)
    - kind: added
      description: Optional browser, assistant, autogravity, embedding and MQTT components
    - kind: added
      description: PodDisruptionBudgets and topology spread by default; NetworkPolicies and autoscaling
    - kind: added
      description: Credentials generated once and kept across upgrades, with guards against losing the encryption key or datastore passwords
    - kind: added
      description: Data migrations on upgrade and a downgrade guard
    - kind: added
      description: Guides for external databases, S3 and integrations, and example values files for local, production, AWS and Functions and Sites installs
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.3.0
    - name: assistant
      image: docker.io/appwrite/assistant:0.8.4
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.11
    - name: browser
      image: docker.io/appwrite/browser:0.3.4
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:2.2.2
    - name: clickhouse
      image: docker.io/clickhouse/clickhouse-server:26.4.3-alpine
    - name: console
      image: docker.io/appwrite/new:1.1.159-self-hosted
    - name: dind
      image: docker.io/library/docker:29.9.0-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.1
    - name: executor
      image: docker.io/openruntimes/executor:0.29.0
    - name: geo
      image: docker.io/appwrite/geo:0.3.1
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:2.2.2
    - name: postgresql
      image: docker.io/appwrite/postgres:0.1.0
    - name: redis
      image: docker.io/redis:7.4.7-alpine
