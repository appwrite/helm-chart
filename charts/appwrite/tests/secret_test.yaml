suite: chart Secret
templates:
  - templates/secret.yaml
release:
  name: aw
  namespace: appwrite
values:
  - values/required.yaml
tests:
  - it: generates every credential once and keeps it on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - exists:
          path: data._APP_OPENSSL_KEY_V1
      - exists:
          path: data._APP_NOTIFICATIONS_TRACKING_SECRET
      - exists:
          path: data._APP_GEO_SECRET
      - exists:
          path: data.postgres-password
      - exists:
          path: data.redis-password
      - exists:
          path: data.clickhouse-password

  - it: uses explicit values
    set:
      appwrite.secrets.opensslKey: my-key
      postgresql.auth.password: pg
    asserts:
      - equal:
          path: data._APP_OPENSSL_KEY_V1
          value: bXkta2V5
      - equal:
          path: data.postgres-password
          value: cGc=

  - it: reuses values already in the cluster
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: aw-appwrite
            namespace: appwrite
          data:
            _APP_OPENSSL_KEY_V1: ZXhpc3Rpbmc=
            postgres-password: cGdwYXNz
    asserts:
      - equal:
          path: data._APP_OPENSSL_KEY_V1
          value: ZXhpc3Rpbmc=
      - equal:
          path: data.postgres-password
          value: cGdwYXNz

  - it: refuses to change the encryption key
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: aw-appwrite
            namespace: appwrite
          data:
            _APP_OPENSSL_KEY_V1: ZXhpc3Rpbmc=
    set:
      appwrite.secrets.opensslKey: different
    asserts:
      - failedTemplate:
          errorPattern: differs from the key stored in the cluster

  - it: refuses to generate a new encryption key on upgrade
    release:
      upgrade: true
    asserts:
      - failedTemplate:
          errorPattern: Refusing to generate a new _APP_OPENSSL_KEY_V1 during an upgrade

  - it: fails instead of generating when generation is off
    set:
      appwrite.secrets.generate: false
    asserts:
      - failedTemplate:
          errorPattern: "No value for _APP_[A-Z_]+: provide it explicitly"

  - it: skips credentials that come from existing Secrets
    set:
      appwrite.secrets.existingSecret: core
      postgresql.auth.existingSecret: pg
      redis.auth.existingSecret: redis
      clickhouse.auth.existingSecret: ch
    asserts:
      - hasDocuments:
          count: 0

  - it: stores an inline SMTP password
    set:
      appwrite.smtp.host: smtp.example.com
      appwrite.smtp.password: hunter2
    asserts:
      - equal:
          path: data.smtp-password
          value: aHVudGVyMg==
