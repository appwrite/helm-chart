suite: in-cluster executor
templates:
  - templates/configmap-env.yaml
  - templates/secret.yaml
  - templates/executor/namespace.yaml
  - templates/executor/serviceaccount.yaml
  - templates/executor/secret.yaml
  - templates/executor/deployment.yaml
  - templates/executor/service.yaml
  - templates/executor/networkpolicy.yaml
  - templates/networkpolicy/egress.yaml
release:
  name: aw
  namespace: apps
values:
  - values/required.yaml
set:
  storage.device: s3
  storage.s3.mode: external
  storage.s3.external.endpoint: http://10.1.2.3:9000
  storage.s3.bucket: files
  storage.s3.accessKeyId.value: key/+
  storage.s3.secretAccessKey.value: secret
  compute.enabled: true
  compute.executor.privileged: true
  compute.functionsRuntimes: [node-22, python-ml-3.11]
  compute.sitesRuntimes: [static-1, node-22]
tests:
  - it: points Appwrite at the executor Service in its namespace
    template: templates/configmap-env.yaml
    asserts:
      - equal:
          path: data._APP_EXECUTOR_HOST
          value: http://aw-appwrite-executor.apps-executor.svc:9900/v1

  - it: requires accepting a privileged container
    template: templates/configmap-env.yaml
    set:
      compute.executor.privileged: false
    asserts:
      - failedTemplate:
          errorPattern: Set compute.executor.privileged=true to accept that

  - it: accepts a RuntimeClass instead of a privileged container
    template: templates/executor/deployment.yaml
    set:
      compute.executor.privileged: false
      compute.executor.runtimeClassName: sysbox-runc
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: sysbox-runc
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.privileged
          value: false

  - it: needs a namespace other than the release's
    template: templates/configmap-env.yaml
    set:
      compute.executor.namespace: apps
    asserts:
      - failedTemplate:
          errorPattern: compute.executor.namespace must differ from the release namespace

  - it: needs a namespace other than the builds'
    template: templates/configmap-env.yaml
    set:
      compute.executor.namespace: apps-builds
    asserts:
      - failedTemplate:
          errorPattern: compute.executor.namespace must differ from compute.builds.namespace

  - it: refuses Appwrite's placeholder orchestrator secret
    template: templates/configmap-env.yaml
    set:
      compute.secrets.orchestratorSecret: your-secret-key
    asserts:
      - failedTemplate:
          errorPattern: compute.secrets.orchestratorSecret is Appwrite's public placeholder

  - it: needs its own Secret when credentials come from existing Secrets
    template: templates/configmap-env.yaml
    set:
      storage.s3.accessKeyId.secretName: s3
      storage.s3.secretAccessKey.secretName: s3
    asserts:
      - failedTemplate:
          errorPattern: compute.executor.existingSecret is required

  - it: creates a namespace that admits privileged pods
    template: templates/executor/namespace.yaml
    asserts:
      - equal:
          path: metadata.name
          value: apps-executor
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged

  - it: leaves the namespace to you
    template: templates/executor/namespace.yaml
    set:
      compute.executor.createNamespace: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing without Functions and Sites
    templates:
      - templates/executor/namespace.yaml
      - templates/executor/serviceaccount.yaml
      - templates/executor/secret.yaml
      - templates/executor/deployment.yaml
      - templates/executor/service.yaml
      - templates/executor/networkpolicy.yaml
    set:
      compute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: copies the executor secret and S3 credentials into its namespace
    templates:
      - templates/executor/secret.yaml
      - templates/secret.yaml
    set:
      compute.secrets.executorSecret: exec
    asserts:
      - template: templates/executor/secret.yaml
        equal:
          path: metadata.namespace
          value: apps-executor
      - template: templates/executor/secret.yaml
        equal:
          path: data
          value:
            executor-secret: ZXhlYw==
            s3-access-key: a2V5Lys=
            s3-secret-key: c2VjcmV0
      - template: templates/secret.yaml
        equal:
          path: data.executor-secret
          value: ZXhlYw==

  - it: uses an existing Secret in its namespace
    template: templates/executor/deployment.yaml
    set:
      compute.secrets.existingSecret: compute
      compute.executor.existingSecret: executor-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPR_EXECUTOR_SECRET
            valueFrom:
              secretKeyRef: {name: executor-credentials, key: executor-secret}
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]

  - it: runs Docker-in-Docker as a privileged sidecar
    template: templates/executor/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: apps-executor
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: dind
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/library/docker:29.9.2-dind
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 4Gi
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.serviceAccountName
          value: aw-appwrite-executor
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]

  - it: starts the executor without privileges of its own
    template: templates/executor/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - notExists:
          path: spec.template.spec.containers[0].securityContext.privileged

  - it: configures the executor
    template: templates/executor/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: EXECUTOR_IMAGE, value: docker.io/openruntimes/executor:1.1.2}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPR_EXECUTOR_IMAGES, value: "openruntimes/node:v5-22,openruntimes/python-ml:v5-3.11,openruntimes/static:v5-1"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPR_EXECUTOR_INACTIVE_THRESHOLD, value: "60"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef: {name: aw-appwrite-executor, key: s3-secret-key}

  - it: pulls the runtime images you list
    template: templates/executor/deployment.yaml
    set:
      compute.executor.images: [registry.example.com/node:v5-22]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPR_EXECUTOR_IMAGES, value: registry.example.com/node:v5-22}

  - it: reaches a plain-HTTP S3 endpoint without the bucket in the path
    template: templates/executor/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: S3_LOCATION, value: "10.1.2.3:9000?region=us-east-1&insecure=true"}

  - it: reaches an HTTPS S3 endpoint
    template: templates/executor/deployment.yaml
    set:
      storage.s3.mode: external
      storage.s3.external.endpoint: https://s3.example.com
      storage.s3.external.region: eu-central
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: S3_LOCATION, value: "s3.example.com?region=eu-central"}

  - it: names the bucket in the hostname on AWS S3
    template: templates/executor/deployment.yaml
    set:
      storage.s3.mode: external
      storage.s3.external.endpoint: ""
      storage.s3.external.region: eu-central-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: S3_LOCATION, value: "files.s3.eu-central-1.amazonaws.com?region=eu-central-1"}

  - it: passes extra arguments to dockerd and extra variables to the executor
    template: templates/executor/deployment.yaml
    set:
      compute.executor.dind.extraArgs: [--registry-mirror=https://mirror.example.com]
      compute.executor.extraEnv:
        - {name: OPR_EXECUTOR_DOCKER_HUB_USERNAME, value: me}
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].command
          content: --registry-mirror=https://mirror.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPR_EXECUTOR_DOCKER_HUB_USERNAME, value: me}

  - it: schedules on the nodes you give it
    template: templates/executor/deployment.yaml
    set:
      compute.executor.nodeSelector: {workload: executor}
      compute.executor.tolerations:
        - {key: workload, value: executor, effect: NoSchedule}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {workload: executor}
      - equal:
          path: spec.template.spec.tolerations[0].value
          value: executor

  - it: exposes the executor on port 9900
    template: templates/executor/service.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: apps-executor
      - equal:
          path: spec.ports[0].port
          value: 9900

  - it: only lets Appwrite pods of the release in
    template: templates/executor/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: apps
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["appwrite/datastore-client"]
          value: "true"

  - it: lets the executor reach an S3 endpoint given as an IP address
    template: templates/executor/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock: {cidr: 10.1.2.3/32}
            ports:
              - {port: 9000, protocol: TCP}

  - it: blocks extra CIDRs
    template: templates/executor/networkpolicy.yaml
    set:
      compute.executor.networkPolicy.deniedCIDRs: [34.118.224.0/20]
    asserts:
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 34.118.224.0/20

  - it: can leave the executor's traffic alone
    template: templates/executor/networkpolicy.yaml
    set:
      compute.executor.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: lets Appwrite reach the executor when egress is restricted
    template: templates/networkpolicy/egress.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: apps-executor
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: appwrite
                    app.kubernetes.io/instance: aw
                    app.kubernetes.io/component: executor
            ports:
              - {port: 9900, protocol: TCP}

  - it: keeps the Docker daemon off the network
    template: templates/executor/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: exec dockerd-entrypoint.sh dockerd --host=unix:///run/dind/docker.sock
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: tcp://

  - it: keeps the Docker daemon's networks out of Docker's default ranges
    template: templates/executor/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: --default-address-pool=base=198.18.0.0/15,size=24

  - it: adds extra egress rules
    template: templates/executor/networkpolicy.yaml
    set:
      compute.executor.networkPolicy.extraEgress:
        - to: [{ipBlock: {cidr: 10.0.0.40/32}}]
          ports: [{port: 443}]
    asserts:
      - contains:
          path: spec.egress
          content:
            to: [{ipBlock: {cidr: 10.0.0.40/32}}]
            ports: [{port: 443}]

  - it: keeps the Docker daemon's data on any volume
    template: templates/executor/deployment.yaml
    set:
      compute.executor.dind.volume:
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 50Gi}}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: docker
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  resources: {requests: {storage: 50Gi}}

  - it: limits the default Docker volume
    template: templates/executor/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: docker
            emptyDir: {sizeLimit: 20Gi}
