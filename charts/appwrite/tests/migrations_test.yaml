suite: migrations
templates:
  - templates/hooks/migrate-hook.yaml
  - templates/hooks/migrate-job.yaml
  - templates/api/deployment.yaml
  - templates/configmap-env.yaml
release:
  name: aw
  namespace: appwrite
values:
  - values/required.yaml
set:
  appwrite.secrets.opensslKey: test-key
  postgresql.auth.password: test-postgres
  clickhouse.auth.password: test-clickhouse
tests:
  - it: records the Appwrite version on the API Deployment
    template: templates/api/deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["appwrite/version"]
          value: "2.3.0"

  - it: doesn't migrate on install
    templates:
      - templates/hooks/migrate-hook.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: migrates in a post-upgrade hook when the version can't be read
    template: templates/hooks/migrate-hook.yaml
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/cli.php, migrate]
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-api

  - it: migrates when the installed version differs
    template: templates/hooks/migrate-hook.yaml
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: aw-appwrite-api
            namespace: appwrite
            annotations:
              appwrite/version: 2.2.0
    asserts:
      - hasDocuments:
          count: 1

  - it: skips the migration when the version is unchanged
    template: templates/hooks/migrate-hook.yaml
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: aw-appwrite-api
            namespace: appwrite
            annotations:
              appwrite/version: 2.3.0
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to downgrade
    template: templates/configmap-env.yaml
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: aw-appwrite-api
            namespace: appwrite
            annotations:
              appwrite/version: 2.4.0
    asserts:
      - failedTemplate:
          errorPattern: Appwrite 2.4.0 is installed and this would downgrade it to 2.3.0

  - it: retries a hook migration that failed
    template: templates/hooks/migrate-hook.yaml
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr: {group: apps, version: v1, resource: deployments}
          namespaced: true
        "batch/v1/Job":
          gvr: {group: batch, version: v1, resource: jobs}
          namespaced: true
      objects:
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: aw-appwrite-api
            namespace: appwrite
            annotations:
              appwrite/version: 2.3.0
        - kind: Job
          apiVersion: batch/v1
          metadata:
            name: aw-appwrite-migrate
            namespace: appwrite
    asserts:
      - hasDocuments:
          count: 1

  - it: renders a Job named after the version and its spec in job mode
    template: templates/hooks/migrate-job.yaml
    set:
      migrations.mode: job
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^aw-appwrite-migrate-2-3-0-[0-9a-f]{8}$
      # Pinned so the rename test below compares against this exact render.
      - equal:
          path: metadata.name
          value: aw-appwrite-migrate-2-3-0-eeb5e31e
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]

  - it: renames the Job when its spec changes
    template: templates/hooks/migrate-job.yaml
    set:
      migrations.mode: job
      migrations.resources.limits.memory: 2Gi
    asserts:
      - notEqual:
          path: metadata.name
          value: aw-appwrite-migrate-2-3-0-eeb5e31e
      - matchRegex:
          path: metadata.name
          pattern: ^aw-appwrite-migrate-2-3-0-[0-9a-f]{8}$

  - it: refuses to regenerate datastore passwords when the Secret is gone
    template: templates/api/deployment.yaml
    release:
      upgrade: true
    set:
      postgresql.auth.password: ""
    asserts:
      - failedTemplate:
          errorPattern: Refusing to generate a new postgres-password during an upgrade

  - it: renders nothing in none mode
    templates:
      - templates/hooks/migrate-hook.yaml
      - templates/hooks/migrate-job.yaml
    release:
      upgrade: true
    set:
      migrations.mode: none
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts appwrite.extraVolumes in the migration Job
    template: templates/hooks/migrate-job.yaml
    set:
      migrations.mode: job
      appwrite.extraVolumes: [{name: db-ca, secret: {secretName: db-ca}}]
      appwrite.extraVolumeMounts: [{name: db-ca, mountPath: /etc/appwrite/db-ca, readOnly: true}]
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: db-ca, secret: {secretName: db-ca}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: db-ca, mountPath: /etc/appwrite/db-ca, readOnly: true}
