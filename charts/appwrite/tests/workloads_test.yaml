suite: workers and tasks
templates:
  - templates/workers/deployment.yaml
  - templates/tasks/deployment.yaml
release:
  name: aw
  namespace: appwrite
values:
  - values/required.yaml
tests:
  - it: runs one worker that consumes every queue
    template: templates/workers/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: aw-appwrite-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/worker.php, all]
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKER_MAX_COROUTINES, value: "78"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKERS_NUM, value: "1"}
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-api
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: letsencrypt
            mountPath: /etc/letsencrypt
            subPath: etc

  - it: inherits worker-wide settings
    template: templates/workers/deployment.yaml
    set:
      workers.nodeSelector: {pool: workers}
      workers.extraEnv: [{name: FOO, value: bar}]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {pool: workers}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: FOO, value: bar}

  - it: mounts appwrite.extraVolumes in every task
    template: templates/tasks/deployment.yaml
    set:
      appwrite.extraVolumes: [{name: db-ca, secret: {secretName: db-ca}}]
      appwrite.extraVolumeMounts: [{name: db-ca, mountPath: /etc/appwrite/db-ca, readOnly: true}]
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: db-ca, secret: {secretName: db-ca}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: db-ca, mountPath: /etc/appwrite/db-ca, readOnly: true}

  - it: runs every task as a single recreated pod
    template: templates/tasks/deployment.yaml
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: runs the scheduler, maintenance and interval commands
    template: templates/tasks/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/cli.php, schedule]
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/cli.php, maintenance]
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/cli.php, interval]
        documentIndex: 2

  - it: can disable tasks
    template: templates/tasks/deployment.yaml
    set:
      tasks.maintenance.enabled: false
      tasks.interval.enabled: false
    asserts:
      - hasDocuments:
          count: 1

  - it: runs one Deployment per queue in separate mode
    template: templates/workers/deployment.yaml
    set:
      workers.mode: separate
    asserts:
      - hasDocuments:
          count: 15
      - equal:
          path: metadata.name
          value: aw-appwrite-worker-databases
        documentSelector:
          path: spec.template.spec.containers[0].command[2]
          value: databases
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKER_MAX_COROUTINES, value: "1"}
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-databases
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKER_MAX_COROUTINES, value: "1"}
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-mails

  - it: only mounts storage for queues that need it
    template: templates/workers/deployment.yaml
    set:
      workers.mode: separate
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content: {name: storage}
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-webhooks
      - contains:
          path: spec.template.spec.volumes
          any: true
          content: {name: storage}
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-deletes
      - contains:
          path: spec.template.spec.volumes
          content: {name: letsencrypt, emptyDir: {}}
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-certificates

  - it: skips disabled queues and uses shared worker resources
    template: templates/workers/deployment.yaml
    set:
      workers.mode: separate
      workers.queues.builds.enabled: false
      workers.queues.functions.enabled: false
    asserts:
      - hasDocuments:
          count: 13
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-webhooks

  - it: never autoscales the databases queue
    template: templates/workers/deployment.yaml
    set:
      workers.mode: separate
      workers.queues.webhooks.autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-webhooks
      - equal:
          path: spec.replicas
          value: 1
        documentSelector:
          path: metadata.name
          value: aw-appwrite-worker-databases

  - it: groups queues and sizes the pool for their combined concurrency
    template: templates/workers/deployment.yaml
    set:
      workers.mode: grouped
      workers.groups:
        core:
          queues: [databases, deletes, mails, certificates]
        usage:
          queues: [stats-usage, stats-resources]
          replicaCount: 2
          maxCoroutines: 12
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/worker.php, "databases,deletes,mails,certificates"]
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKER_MAX_COROUTINES, value: "18"}
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: _APP_WORKER_MAX_COROUTINES, value: "12"}
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 2
        documentIndex: 1

  - it: labels workers for the background NetworkPolicy
    template: templates/workers/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["appwrite/role"]
          value: worker

  - it: splits the scheduler in separate mode
    template: templates/tasks/deployment.yaml
    set:
      tasks.scheduler.mode: separate
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/cli.php, stats-resources]
        documentSelector:
          path: metadata.name
          value: aw-appwrite-stats-resources
      - equal:
          path: spec.template.metadata.labels["appwrite/role"]
          value: task
