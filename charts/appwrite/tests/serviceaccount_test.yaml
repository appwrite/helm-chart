suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: my-release
  namespace: appwrite
tests:
  - it: renders a ServiceAccount with the token mount disabled
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: my-release-appwrite
      - equal:
          path: metadata.namespace
          value: appwrite
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: sets the recommended labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: appwrite
            app.kubernetes.io/instance: my-release
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: appwrite
            app.kubernetes.io/version: "2.3.0"
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^appwrite-\d+\.\d+\.\d+

  - it: honours a custom name and merges common annotations
    set:
      serviceAccount.name: custom
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123:role/appwrite
      commonAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123:role/appwrite
            team: platform

  - it: is not rendered when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the release name alone when it already contains the chart name
    release:
      name: appwrite-prod
    asserts:
      - equal:
          path: metadata.name
          value: appwrite-prod

  - it: respects fullnameOverride
    set:
      fullnameOverride: aw
    asserts:
      - equal:
          path: metadata.name
          value: aw
