# Every optional component but embedding, used by the nightly workflow together
# with the compute values hack/compute-plane.sh writes (S3 next to the cluster,
# Functions and Sites). Also linted and rendered on its own like the other
# scenarios.
#
# CPU requests are cut down so everything fits on a single kind node on a
# 2-vCPU GitHub-hosted runner, next to the control plane and Traefik.
appwrite:
  domain: appwrite.ci.local
  certificatesEmail: ci@example.com
  # Exercises force-HTTPS on internal traffic: probes, the smoke tests and
  # build callbacks use the internal API host, which Appwrite exempts.
  forceHttps: true
  vectorsDb:
    enabled: true
api:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
realtime:
  resources:
    requests:
      cpu: 50m
console:
  resources:
    requests:
      cpu: 20m
workers:
  combined:
    resources:
      requests:
        cpu: 100m
tasks:
  scheduler:
    mode: separate
    resources:
      requests:
        cpu: 20m
  maintenance:
    resources:
      requests:
        cpu: 10m
  interval:
    resources:
      requests:
        cpu: 10m
browser:
  enabled: true
  resources:
    requests:
      cpu: 50m
assistant:
  enabled: true
  # Not a real key: the assistant only needs one to start.
  openaiApiKey: sk-ci-placeholder
  resources:
    requests:
      cpu: 10m
autogravity:
  enabled: true
  resources:
    requests:
      cpu: 20m
# embedding stays off: it downloads a ~550 MB model from Hugging Face at
# start-up and wants ~3 GiB of memory, which a CI runner can't count on.
# Its templates are covered by the unit tests.
mqtt:
  enabled: true
  resources:
    requests:
      cpu: 20m
postgresql:
  resources:
    requests:
      cpu: 50m
clickhouse:
  resources:
    requests:
      cpu: 50m
redis:
  resources:
    requests:
      cpu: 20m
compute:
  builds:
    # Builds get an 8-CPU limit; the default overcommit requests 1 CPU,
    # which doesn't fit on the runner next to everything else.
    cpuOvercommit: 40
migrations:
  mode: job
networkPolicy:
  enabled: true
