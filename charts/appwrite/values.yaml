# Default values for the Appwrite chart.
#
# Every key is documented with a `# --` comment so helm-docs can render the
# README table. Schema annotations refine the generated values.schema.json
# where the inferred type isn't enough.
#
# Per-component settings fall back to `defaults` key by key: a component
# value that is empty ({}, [], "" or null) inherits the matching `defaults`
# value, anything else replaces it entirely (objects aren't deep-merged).

# @schema
# additionalProperties: true
# @schema
global:
  # -- Registry that replaces the registry of every image, e.g. a pull-through cache.
  imageRegistry: ""
  # -- Image pull secrets added to every pod, as a list of Secret names (or
  # `{name: ...}` objects).
  imagePullSecrets: [] # @schema item: string
  # -- Storage class for every PersistentVolumeClaim that doesn't set one. `-` means no class.
  storageClass: ""

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified app name used in resource names.
fullnameOverride: ""
# -- Labels added to every resource rendered by the chart.
commonLabels: {} # @schema additionalProperties: {type: string}
# -- Annotations added to every resource rendered by the chart.
commonAnnotations: {} # @schema additionalProperties: {type: string}

# Appwrite image, shared by the API, realtime, workers, tasks, hooks and tests.
image:
  # -- Image registry.
  registry: docker.io
  # -- Image repository.
  repository: appwrite/appwrite
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""
  # -- Image digest (`sha256:...`). When set it pins the image and the tag is informational.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]

# -- Pod security context for every pod running the Appwrite image.
# UID/GID 82 is `www-data`, which owns `/storage` in the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  fsGroup: 82
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context for every container running the Appwrite image.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

# Defaults applied to every pod the chart runs, including datastores.
# Each component can override a key with its own value.
defaults:
  # -- Annotations added to every pod.
  podAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Labels added to every pod.
  podLabels: {} # @schema additionalProperties: {type: string}
  # -- Node selector for every pod.
  nodeSelector: {} # @schema additionalProperties: {type: string}
  # -- Tolerations for every pod.
  tolerations: [] # @schema item: object
  # -- Affinity for every pod.
  affinity: {} # @schema additionalProperties: true
  # -- Topology spread constraints for every pod. The component's selector labels
  # are filled in when `labelSelector` is omitted. Leave empty for a soft spread
  # across nodes on scalable components.
  topologySpreadConstraints: [] # @schema item: object
  # -- Priority class for every pod.
  priorityClassName: ""

serviceAccount:
  # -- Create a ServiceAccount for Appwrite pods.
  create: true
  # -- Name of the ServiceAccount. Defaults to the fullname when `create` is true, `default` otherwise.
  name: ""
  # -- Annotations for the ServiceAccount (e.g. workload identity bindings).
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Mount the ServiceAccount token. Appwrite doesn't talk to the Kubernetes API.
  automountServiceAccountToken: false

# Appwrite configuration shared by every Appwrite pod. The chart turns these
# into `_APP_*` environment variables; see `config` for anything not covered.
appwrite:
  # -- Hostname of the Appwrite API and console (`_APP_DOMAIN`). Required.
  domain: ""
  # -- Hostname of the console (`_APP_CONSOLE_DOMAIN`). Defaults to `domain`.
  consoleDomain: ""
  # -- Parent domain for function preview URLs (`_APP_DOMAIN_FUNCTIONS`). Defaults to `functions.<domain>`.
  functionsDomain: ""
  # -- Parent domain for site preview URLs (`_APP_DOMAIN_SITES`). Defaults to `sites.<domain>`.
  sitesDomain: ""
  domainTargets:
    # -- Hostname custom domains must CNAME to (`_APP_DOMAIN_TARGET_CNAME`). Defaults to `domain`.
    cname: ""
    # -- IPv4 addresses custom domains may point an A record to, comma-separated (`_APP_DOMAIN_TARGET_A`).
    a: ""
    # -- IPv6 addresses custom domains may point an AAAA record to, comma-separated (`_APP_DOMAIN_TARGET_AAAA`).
    aaaa: ""
    # -- CAA record value custom domains must allow (`_APP_DOMAIN_TARGET_CAA`).
    caa: ""
  # -- Redirect HTTP to HTTPS and generate HTTPS URLs (`_APP_OPTIONS_FORCE_HTTPS`
  # and `_APP_OPTIONS_ROUTER_FORCE_HTTPS`). Turn it off only when TLS isn't
  # terminated in front of Appwrite.
  forceHttps: true
  # -- Reject requests for hostnames Appwrite doesn't know (`_APP_OPTIONS_ROUTER_PROTECTION`).
  routerProtection: false
  # -- Have Appwrite issue Let's Encrypt certificates for function and site
  # subdomains (`_APP_ROUTER_AUTO_CERTIFICATES`). Off by default: TLS for
  # wildcard domains is expected to terminate at the ingress or Gateway.
  autoCertificates: false
  # -- Email used to register Let's Encrypt certificates (`_APP_EMAIL_CERTIFICATES`). Required.
  certificatesEmail: ""
  # -- Log format (`_APP_LOGGING_FORMAT`).
  logFormat: json # @schema enum: [json, pretty]
  # -- Collect usage statistics in ClickHouse (`_APP_USAGE_STATS`).
  usageStats: true
  # -- Swoole workers per CPU in the API (`_APP_WORKER_PER_CORE`).
  workerPerCore: 6 # @schema minimum: 1
  console:
    # -- Only the first user can sign up to the console; everyone else needs an invite (`_APP_CONSOLE_WHITELIST_ROOT`).
    whitelistRoot: true
    # -- Emails allowed to sign up to the console (`_APP_CONSOLE_WHITELIST_EMAILS`).
    whitelistEmails: [] # @schema item: string
    # -- IPs allowed to sign up to the console (`_APP_CONSOLE_WHITELIST_IPS`).
    whitelistIPs: [] # @schema item: string
  system:
    # -- Sender name for emails Appwrite sends (`_APP_SYSTEM_EMAIL_NAME`).
    emailName: Appwrite
    # -- Sender address for emails Appwrite sends (`_APP_SYSTEM_EMAIL_ADDRESS`).
    emailAddress: ""
    # -- Address shown to users for security issues (`_APP_EMAIL_SECURITY`).
    securityEmailAddress: ""
  database:
    # -- Total connections Appwrite may open to the database, shared by all
    # pods (`_APP_CONNECTIONS_MAX`). Keep it below the database's `max_connections`.
    connectionsMax: 151 # @schema minimum: 1
    # -- Number of Appwrite processes sharing `connectionsMax`
    # (`_APP_POOL_CLIENTS`): each pod opens `connectionsMax / poolClients`
    # connections. Must be at least the number of Appwrite pods, counting
    # autoscalers at `maxReplicas`; NOTES warns when it isn't.
    poolClients: 15 # @schema minimum: 1
  smtp:
    # -- SMTP server (`_APP_SMTP_HOST`). Empty disables email.
    host: ""
    # -- SMTP port (`_APP_SMTP_PORT`).
    port: 587 # @schema type: [integer, string]
    # -- SMTP encryption (`_APP_SMTP_SECURE`).
    secure: tls # @schema enum: ["", tls, ssl]
    # -- SMTP username (`_APP_SMTP_USERNAME`).
    username: ""
    # -- SMTP password (`_APP_SMTP_PASSWORD`). Ignored when `existingSecret` is set.
    password: ""
    # -- Existing Secret holding the SMTP password.
    existingSecret: ""
    # -- Key in `existingSecret` holding the SMTP password.
    passwordKey: smtp-password
  storage:
    # -- Where Appwrite stores files (`_APP_STORAGE_DEVICE`): `local` uses the
    # `/storage` volume (see `persistence`), `s3` any S3-compatible object
    # store. S3 is required when `compute.enabled` is true.
    device: local # @schema enum: [local, s3]
    # -- Maximum file size in bytes (`_APP_STORAGE_LIMIT`).
    limit: 30000000 # @schema minimum: 0
    # -- Maximum size in bytes of files Appwrite renders previews for (`_APP_STORAGE_PREVIEW_LIMIT`).
    previewLimit: 20000000 # @schema minimum: 0
    s3:
      # -- Endpoint of an S3-compatible store, e.g. `https://fsn1.your-objectstorage.com`. Empty uses AWS S3.
      endpoint: ""
      # -- Region.
      region: us-east-1
      # -- Bucket.
      bucket: ""
      # -- Access key ID. Ignored when `existingSecret` is set.
      accessKey: ""
      # -- Secret access key. Ignored when `existingSecret` is set.
      secretKey: ""
      # -- Existing Secret holding the access key ID and secret access key.
      existingSecret: ""
      # -- Key in `existingSecret` holding the access key ID.
      accessKeyKey: s3-access-key
      # -- Key in `existingSecret` holding the secret access key.
      secretKeyKey: s3-secret-key
  secrets:
    # -- Existing Secret holding the core secrets. When empty the chart
    # generates them once and keeps them across upgrades and uninstalls.
    existingSecret: ""
    # -- Generate missing credentials (core secrets and built-in datastore passwords). Set to false with GitOps tools that
    # render templates without cluster access (Argo CD, `helm template`),
    # where generated values would change on every render.
    generate: true
    # -- Allow `opensslKey` to differ from the key already stored in the
    # cluster. Appwrite can't re-encrypt data, so changing the key makes
    # encrypted data unreadable.
    allowKeyRotation: false
    keys:
      # -- Key holding `_APP_OPENSSL_KEY_V1`, which encrypts data at rest and signs JWTs.
      opensslKey: _APP_OPENSSL_KEY_V1
      # -- Key holding `_APP_NOTIFICATIONS_TRACKING_SECRET`.
      trackingSecret: _APP_NOTIFICATIONS_TRACKING_SECRET
      # -- Key holding `_APP_GEO_SECRET`, shared with the geo service.
      geoSecret: _APP_GEO_SECRET
    # -- Explicit `_APP_OPENSSL_KEY_V1`, e.g. when migrating from Docker. Never change it after install.
    opensslKey: ""
    # -- Explicit `_APP_NOTIFICATIONS_TRACKING_SECRET`.
    trackingSecret: ""
    # -- Explicit `_APP_GEO_SECRET`.
    geoSecret: ""
  documentsDb:
    # -- Enable DocumentsDB databases (`_APP_DOCUMENTSDB`), backed by a MongoDB replica set.
    enabled: false
    # -- MongoDB hostname.
    host: ""
    # -- MongoDB port.
    port: 27017 # @schema type: [string, integer]
    # -- Database name. Empty uses the main database name.
    database: ""
    # -- User. Empty uses the main database user.
    username: ""
    # -- Password. Ignored when `existingSecret` is set. Empty uses the main database password.
    password: ""
    # -- Existing Secret holding the password.
    existingSecret: ""
    # -- Key in the Secret holding the password.
    passwordKey: documentsdb-password
  vectorsDb:
    # -- Enable VectorsDB databases (`_APP_VECTORSDB`), backed by PostgreSQL with pgvector.
    enabled: false
    # -- PostgreSQL hostname. Empty uses the main database, which must then be PostgreSQL.
    host: ""
    # -- PostgreSQL port.
    port: 5432 # @schema type: [string, integer]
    # -- Database name. Empty uses the main database name.
    database: ""
    # -- User. Empty uses the main database user.
    username: ""
    # -- Password. Ignored when `existingSecret` is set. Empty uses the main database password.
    password: ""
    # -- Existing Secret holding the password.
    existingSecret: ""
    # -- Key in the Secret holding the password.
    passwordKey: vectorsdb-password
  # -- Extra `_APP_*` environment variables for every Appwrite pod. They
  # override the chart's defaults and computed values, including those set
  # per container (`_APP_CPU_NUM`, `_APP_WORKERS_NUM`,
  # `_APP_WORKER_MAX_COROUTINES`, `_APP_CONNECTIONS_DB_*`), except
  # credentials, which come from Secrets. See
  # https://appwrite.io/docs/advanced/self-hosting/configuration/environment-variables.
  config: {} # @schema additionalProperties: {type: [string, number, boolean]}; patternProperties: {"^_APP_[A-Z0-9_]+$": {}}
  # -- Extra sensitive `_APP_*` environment variables, stored in a Secret.
  # Same precedence as `config`; changing them restarts Appwrite pods.
  secretConfig: {} # @schema additionalProperties: {type: string}
  # -- Extra environment variables for every Appwrite container, as a list of EnvVar objects.
  extraEnv: [] # @schema item: object
  # -- Extra `envFrom` sources for every Appwrite container.
  extraEnvFrom: [] # @schema item: object

# Functions and Sites run on Open Runtimes services. Builds run inside the
# cluster: the chart deploys the orchestrator, which starts each build as a
# Kubernetes Job in a separate namespace. Executions need a Docker daemon, so
# the executor runs on a Docker host next to the cluster. See docs/executor.md.
compute:
  # -- Enable Functions and Sites. Needs `appwrite.storage.device: s3`, and
  # with the in-cluster executor `compute.executor.privileged` (see docs/executor.md).
  enabled: false
  # The open-runtimes executor, which starts a container per function or site
  # runtime and executes requests in it. It needs a Docker daemon, so in the
  # cluster it runs on Docker-in-Docker, in a namespace of its own.
  executor:
    # -- Where executions run. `cluster`: the chart runs the executor on
    # Docker-in-Docker in `compute.executor.namespace`. `external`: an executor
    # you run on a Docker host, at `host`.
    mode: cluster # @schema enum: [cluster, external]
    # -- URL of an external executor's API (`_APP_EXECUTOR_HOST`) when `mode` is `external`, e.g. `http://10.0.0.20:9900/v1`.
    host: ""
    # -- Run the Docker daemon as a privileged container, which makes it root
    # on its node. Required in `cluster` mode unless `runtimeClassName` names a
    # runtime that runs Docker without it, such as Sysbox. Give the executor
    # nodes of its own (`nodeSelector`, `tolerations`).
    privileged: false
    # -- RuntimeClass of executor pods, e.g. `sysbox-runc`.
    runtimeClassName: ""
    # -- Namespace of the executor. Defaults to `<release namespace>-executor`.
    # Use a different one per release when several releases share a namespace.
    namespace: ""
    # -- Create the namespace, labelled for the `privileged` Pod Security
    # Standard. Set to false to create it yourself.
    createNamespace: true
    # -- Executor replicas. Each has its own Docker daemon: a runtime starts on
    # the replica an execution reaches and stays there until it's idle.
    replicaCount: 1 # @schema minimum: 0
    image:
      # -- Image registry. The executor image is pulled by the Docker daemon in
      # the pod, not by the kubelet, so image pull secrets don't apply to it.
      registry: docker.io
      # -- Image repository.
      repository: openruntimes/executor
      # -- Image tag.
      tag: 0.29.0
      # -- Image digest.
      digest: ""
    dind:
      image:
        # -- Image registry.
        registry: docker.io
        # -- Image repository of the Docker daemon, also used to start the executor.
        repository: library/docker
        # -- Image tag.
        tag: 29.9.0-dind
        # -- Image digest.
        digest: ""
        # -- Image pull policy.
        pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
      # -- Extra arguments for `dockerd`, e.g. `--registry-mirror=https://mirror.example.com`.
      extraArgs: [] # @schema item: string
      # -- Volume for the Docker daemon's images and containers. Runtime images
      # are pulled again when the pod is replaced.
      volume:
        emptyDir:
          sizeLimit: 20Gi
    # -- Resources of the Docker daemon container, which runs the executor and
    # every runtime: size it for the executions you expect.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
    # -- Seconds a runtime may stay idle before it's removed (`OPR_EXECUTOR_INACTIVE_THRESHOLD`).
    inactiveThreshold: 60
    # -- Runtime images to pull when the executor starts (`OPR_EXECUTOR_IMAGES`).
    # Empty derives them from `functionsRuntimes` and `sitesRuntimes`, e.g.
    # `node-22` becomes `openruntimes/node:v5-22`.
    images: [] # @schema item: string
    # -- Secret in the executor namespace with the keys `executor-secret`,
    # `s3-access-key` and `s3-secret-key`. Pods can't read Secrets in other
    # namespaces, so it's required when `compute.secrets.existingSecret` or
    # `appwrite.storage.s3.existingSecret` is set. Otherwise the chart creates it.
    existingSecret: ""
    networkPolicy:
      # -- Restrict executor pods' traffic: incoming only from Appwrite pods of
      # this release; outgoing (which includes every runtime) only to DNS, the
      # S3 endpoint and public addresses. Takes effect only with a CNI that
      # enforces NetworkPolicies.
      enabled: true
      # -- Extra egress rules (NetworkPolicyEgressRule) for executor pods, e.g.
      # an S3 endpoint on a private network that isn't an IP address, or a
      # registry mirror.
      extraEgress: [] # @schema item: object
      # -- CIDRs executor pods may not reach, on top of the private, link-local,
      # CGNAT and special-purpose ranges always blocked.
      deniedCIDRs: [] # @schema item: string
    # -- Seconds to wait on shutdown.
    terminationGracePeriodSeconds: 60
    # -- Extra environment variables for the executor. Variables named
    # `OPR_EXECUTOR_*` are passed on to it, e.g. `OPR_EXECUTOR_DOCKER_HUB_USERNAME`
    # and `OPR_EXECUTOR_DOCKER_HUB_PASSWORD` to pull runtime images as a Docker Hub user.
    extraEnv: [] # @schema item: object
    # -- Pod annotations, merged over `defaults.podAnnotations`.
    podAnnotations: {} # @schema additionalProperties: {type: string}
    # -- Pod labels, merged over `defaults.podLabels`.
    podLabels: {} # @schema additionalProperties: {type: string}
    # -- Node selector. Empty inherits `defaults.nodeSelector`.
    nodeSelector: {} # @schema additionalProperties: {type: string}
    # -- Tolerations. Empty inherits `defaults.tolerations`.
    tolerations: [] # @schema item: object
    # -- Affinity. Empty inherits `defaults.affinity`.
    affinity: {} # @schema additionalProperties: true
    # -- Topology spread constraints. Empty spreads replicas across nodes.
    topologySpreadConstraints: [] # @schema item: object
    # -- Priority class. Empty inherits `defaults.priorityClassName`.
    priorityClassName: ""
  orchestrator:
    # -- Where builds run. `cluster`: the chart runs the orchestrator, which
    # starts every build as a Kubernetes Job in `compute.builds.namespace`.
    # `external`: an orchestrator you run on a Docker host, at `host`.
    mode: cluster # @schema enum: [cluster, external]
    # -- URL of an external orchestrator's API (`_APP_JOBS_HOST`) when `mode` is `external`, e.g. `http://10.0.0.20:8080`.
    host: ""
    image:
      # -- Image registry.
      registry: ghcr.io
      # -- Image repository: the orchestrator's jobs service, with the Kubernetes backend.
      repository: open-runtimes/orchestrator/jobs-service
      # -- Image tag.
      tag: 2.2.2
      # -- Image digest.
      digest: ""
      # -- Image pull policy.
      pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    # -- Pod security context. The image's `nonroot` user is UID 65532.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # -- Container security context.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      privileged: false
      capabilities:
        drop: [ALL]
    # -- Pod annotations, merged over `defaults.podAnnotations`.
    podAnnotations: {} # @schema additionalProperties: {type: string}
    # -- Pod labels, merged over `defaults.podLabels`.
    podLabels: {} # @schema additionalProperties: {type: string}
    # -- Node selector. Empty inherits `defaults.nodeSelector`.
    nodeSelector: {} # @schema additionalProperties: {type: string}
    # -- Tolerations. Empty inherits `defaults.tolerations`.
    tolerations: [] # @schema item: object
    # -- Affinity. Empty inherits `defaults.affinity`.
    affinity: {} # @schema additionalProperties: true
    # -- Priority class. Empty inherits `defaults.priorityClassName`.
    priorityClassName: ""
  # Build Jobs, when `compute.orchestrator.mode` is `cluster`. Builds run the
  # build commands of your functions and sites, so they get their own
  # namespace, admitted under the `baseline` Pod Security Standard, with no
  # ServiceAccount token and a NetworkPolicy that keeps them away from the
  # rest of the cluster.
  builds:
    # -- Namespace for build Jobs. Defaults to `<release namespace>-builds`.
    # Use a different one per release when several releases share a namespace.
    namespace: ""
    # -- Create the namespace, labelled for the `baseline` Pod Security Standard.
    # Set to false to create it yourself.
    createNamespace: true
    sidecarImage:
      # -- Image registry.
      registry: ghcr.io
      # -- Image repository of the sidecar that moves sources, outputs and caches for each build.
      repository: open-runtimes/orchestrator/job-sidecar
      # -- Image tag.
      tag: 2.2.2
      # -- Image digest.
      digest: ""
    # -- Divides each build's CPU limit to get its CPU request
    # (`KUBE_CPU_OVERCOMMIT`). Appwrite gives builds up to 8 CPUs; the default
    # requests 1.
    cpuOvercommit: 8 # @schema minimum: 1
    # -- Divides each build's memory limit to get its memory request
    # (`KUBE_MEMORY_OVERCOMMIT`). Appwrite gives builds up to 8 GiB; the default
    # requests 1 GiB.
    memoryOvercommit: 8 # @schema minimum: 1
    # -- How long finished build Jobs are kept (`JOB_RETENTION`).
    retention: 15m
    # -- Node selector for build pods.
    nodeSelector: {} # @schema additionalProperties: {type: string}
    # -- Tolerations for build pods.
    tolerations: [] # @schema item: object
    networkPolicy:
      # -- Restrict build pods' traffic: no incoming connections; outgoing only
      # to DNS, the API, the orchestrator, the S3 endpoint and public
      # addresses. Takes effect only with a CNI that enforces NetworkPolicies.
      enabled: true
      # -- Extra egress rules (NetworkPolicyEgressRule) for build pods, e.g. an
      # S3 endpoint on a private network that isn't an IP address, or a
      # private package registry.
      extraEgress: [] # @schema item: object
      # -- CIDRs build pods may not reach, on top of the private, link-local,
      # CGNAT and special-purpose ranges always blocked. Add pod, Service and
      # node ranges that aren't private addresses (GKE privately used public
      # ranges, IPv6 clusters).
      deniedCIDRs: [] # @schema item: string
  # -- URL build Jobs use to download sources from and report back to
  # Appwrite (`_APP_JOBS_ENDPOINT`). Defaults to the API Service in the
  # cluster, or, with an external orchestrator, to `https://<domain>`
  # (`http` when `forceHttps` is off), whose host must then be `appwrite.domain`.
  appwriteEndpoint: ""
  # -- Function runtimes to enable (`_APP_FUNCTIONS_RUNTIMES`). Empty keeps the
  # Docker installer's list (node-16.0, php-8.0, python-3.9, ruby-3.0).
  functionsRuntimes: [] # @schema item: string
  # -- Site runtimes to enable (`_APP_SITES_RUNTIMES`). Empty keeps Appwrite's
  # default list. Sites build with `node-22`, so keep it in the list.
  sitesRuntimes: [] # @schema item: string
  secrets:
    # -- Existing Secret holding the executor and orchestrator secrets. When
    # empty, the chart generates them; configure the executor (and an external
    # orchestrator) with the same values.
    existingSecret: ""
    # -- Key holding the executor secret (`_APP_EXECUTOR_SECRET`, `OPR_EXECUTOR_SECRET` on the executor).
    executorSecretKey: executor-secret
    # -- Key holding the orchestrator API key (`_APP_JOBS_SECRET`, the file in `API_KEY_FILE` on the orchestrator).
    orchestratorSecretKey: orchestrator-secret
    # -- Explicit executor secret.
    executorSecret: ""
    # -- Explicit orchestrator API key.
    orchestratorSecret: ""

# The HTTP API (`php app/http.php`).
api:
  # -- Number of API replicas. Ignored when autoscaling is enabled.
  replicaCount: 1 # @schema minimum: 0
  # -- CPUs Appwrite sizes its worker and connection pools for (`_APP_CPU_NUM`).
  # Derived from the CPU limit, then the CPU request, when empty.
  cpuNum: "" # @schema type: [string, integer]
  # -- Resource requests and limits.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  autoscaling:
    # -- Create a HorizontalPodAutoscaler.
    enabled: false
    # -- Minimum replicas.
    minReplicas: 2
    # -- Maximum replicas.
    maxReplicas: 10
    # -- Target average CPU utilisation, in percent.
    targetCPUUtilizationPercentage: 75
    # -- Target average memory utilisation, in percent. Empty disables the metric.
    targetMemoryUtilizationPercentage: "" # @schema type: [string, integer]
    # -- HPA scaling behaviour.
    behavior: {} # @schema additionalProperties: true
  pdb:
    # -- Create a PodDisruptionBudget when more than one replica can run.
    enabled: true
    # -- Minimum available pods. Takes precedence over `maxUnavailable`.
    minAvailable: "" # @schema type: [string, integer]
    # -- Maximum unavailable pods.
    maxUnavailable: 1 # @schema type: [string, integer]
  service:
    # -- Service type.
    type: ClusterIP
    # -- Service port.
    port: 80
    # -- Service annotations.
    annotations: {} # @schema additionalProperties: {type: string}
  # -- Deployment update strategy.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  # -- Seconds to wait for in-flight requests on shutdown. Swoole drains for up to 30s.
  terminationGracePeriodSeconds: 45
  # -- Seconds to sleep before shutdown so endpoints are removed first.
  preStopSleepSeconds: 5
  startupProbe:
    # -- Enable the startup probe. The first start creates database schemas and can take minutes.
    enabled: true
    # -- Seconds to wait before the first probe.
    initialDelaySeconds: 5
    # -- Seconds between probes.
    periodSeconds: 5
    # -- Seconds before a probe times out.
    timeoutSeconds: 5
    # -- Consecutive failures before the probe counts as failed.
    failureThreshold: 72
  readinessProbe:
    # -- Enable the readiness probe.
    enabled: true
    # -- Seconds between probes.
    periodSeconds: 10
