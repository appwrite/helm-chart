# Scheduled tasks. Each runs as a single replica: Appwrite has no leader
# election, so running two copies would schedule work twice.
tasks:
  scheduler:
    # -- Run the scheduler for function, execution and message schedules.
    enabled: true
    # -- `combined` runs one scheduler pod. `separate` runs the functions,
    # executions and messages schedulers and the resource-usage task as
    # separate pods, each with these resources.
    mode: combined # @schema enum: [combined, separate]
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  maintenance:
    # -- Run the maintenance task (cleanup, certificate renewal).
    enabled: true
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
  interval:
    # -- Run the interval task (domain verification, stale execution cleanup).
    enabled: true
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
  # -- Seconds to wait on shutdown.
  terminationGracePeriodSeconds: 30
  # -- Pod security context. Empty inherits `podSecurityContext`.
  podSecurityContext: {} # @schema additionalProperties: true
  # -- Container security context. Empty inherits `containerSecurityContext`.
  containerSecurityContext: {} # @schema additionalProperties: true
  # -- Pod annotations, merged over `defaults.podAnnotations`.
  podAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Pod labels, merged over `defaults.podLabels`.
  podLabels: {} # @schema additionalProperties: {type: string}
  # -- Node selector. Empty inherits `defaults.nodeSelector`.
  nodeSelector: {} # @schema additionalProperties: {type: string}
  # -- Tolerations. Empty inherits `defaults.tolerations`.
  tolerations: [] # @schema item: object
  # -- Affinity. Empty inherits `defaults.affinity`.
  affinity: {} # @schema additionalProperties: true
  # -- Priority class. Empty inherits `defaults.priorityClassName`.
  priorityClassName: ""
  # -- Extra environment variables for every task.
  extraEnv: [] # @schema item: object

# IP geolocation service used for sessions and audit logs.
geo:
  # -- Deploy the geo service. When disabled, Appwrite skips geolocation.
  enabled: true
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: appwrite/geo
    # -- Image tag.
    tag: 0.3.1
    # -- Image digest.
    digest: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
  # -- Number of replicas.
  replicaCount: 1 # @schema minimum: 0
  # -- Resource requests and limits.
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Pod security context. The geo server listens on port 80, so the
  # unprivileged port range is lowered for the pod instead of running as root.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 82
    runAsGroup: 82
    seccompProfile:
      type: RuntimeDefault
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"
  # -- Container security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  # -- Pod annotations, merged over `defaults.podAnnotations`.
  podAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Pod labels, merged over `defaults.podLabels`.
  podLabels: {} # @schema additionalProperties: {type: string}
  # -- Node selector. Empty inherits `defaults.nodeSelector`.
  nodeSelector: {} # @schema additionalProperties: {type: string}
  # -- Tolerations. Empty inherits `defaults.tolerations`.
  tolerations: [] # @schema item: object
  # -- Affinity. Empty inherits `defaults.affinity`.
  affinity: {} # @schema additionalProperties: true
  # -- Priority class. Empty inherits `defaults.priorityClassName`.
  priorityClassName: ""

# Built-in PostgreSQL, a single-replica StatefulSet meant for evaluation and
# small installs. Use a managed or operator-run database in production and
# configure it under `externalDatabase`.
postgresql:
  # -- Deploy the built-in PostgreSQL.
  enabled: true
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository. Appwrite's image is PostgreSQL 18 with the extensions Appwrite needs.
    repository: appwrite/postgres
    # -- Image tag.
    tag: 0.1.0
    # -- Image digest.
    digest: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
  auth:
    # -- Database name.
    database: appwrite
    # -- Database user.
    username: appwrite
    # -- Password. Generated and kept across upgrades when empty.
    password: ""
    # -- Existing Secret holding the password.
    existingSecret: ""
    # -- Key in the Secret holding the password.
    passwordKey: postgres-password
  # -- `max_connections`. Defaults to `appwrite.database.connectionsMax` + 20.
  maxConnections: "" # @schema type: [string, integer]
  # -- Extra PostgreSQL settings passed as `-c name=value`.
  extraConfig: {} # @schema additionalProperties: {type: [string, number, boolean]}
  # -- Resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  persistence:
    # -- Persist data in a PersistentVolumeClaim. Data is lost on restart when disabled.
    enabled: true
    # -- Storage class. Empty uses the cluster default.
    storageClass: ""
    # -- Access modes.
    accessModes: [ReadWriteOnce] # @schema item: string
    # -- Volume size.
    size: 10Gi
    # -- Annotations for the PersistentVolumeClaim.
    annotations: {} # @schema additionalProperties: {type: string}
  # -- Pod security context. The image's `postgres` user is UID 999.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  # -- Pod annotations, merged over `defaults.podAnnotations`.
  podAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Pod labels, merged over `defaults.podLabels`.
  podLabels: {} # @schema additionalProperties: {type: string}
  # -- Node selector. Empty inherits `defaults.nodeSelector`.
  nodeSelector: {} # @schema additionalProperties: {type: string}
  # -- Tolerations. Empty inherits `defaults.tolerations`.
  tolerations: [] # @schema item: object
  # -- Affinity. Empty inherits `defaults.affinity`.
  affinity: {} # @schema additionalProperties: true
  # -- Priority class. Empty inherits `defaults.priorityClassName`.
  priorityClassName: ""

# External database, used when `postgresql.enabled` is false. PostgreSQL is
# recommended; it needs the pgvector, PostGIS and pg_trgm extensions that
