# Scheduled tasks. Each runs as a single replica: Appwrite has no leader
# election, so running two copies would schedule work twice.
tasks:
  scheduler:
    # -- Run the scheduler for function, execution and message schedules.
    enabled: true
    # -- `combined` runs one scheduler pod. `separate` runs the functions,
    # executions and messages schedulers and the resource-usage task as
    # separate pods, each with these resources.
    mode: combined # @schema enum: [combined, separate]
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  maintenance:
    # -- Run the maintenance task (cleanup, certificate renewal).
    enabled: true
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
  interval:
    # -- Run the interval task, which verifies custom domains and queues their certificates.
    enabled: true
    # -- Resource requests and limits.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
  # -- Seconds to wait on shutdown.
  terminationGracePeriodSeconds: 30
  # -- Pod security context, merged key by key over `podSecurityContext`.
  podSecurityContext: {} # @schema additionalProperties: true
  # -- Container security context, merged key by key over `containerSecurityContext`.
  containerSecurityContext: {} # @schema additionalProperties: true
