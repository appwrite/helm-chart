  # -- Affinity. Empty inherits `defaults.affinity`.
  affinity: {} # @schema additionalProperties: true
  # -- Priority class. Empty inherits `defaults.priorityClassName`.
  priorityClassName: ""
  # -- Extra environment variables for every task.
  extraEnv: [] # @schema item: object
  # -- Extra volumes for every task.
  extraVolumes: [] # @schema item: object
  # -- Extra volume mounts for every task.
  extraVolumeMounts: [] # @schema item: object
  # -- Extra init containers.
  extraInitContainers: [] # @schema item: object
  # -- Extra sidecar containers.
  extraContainers: [] # @schema item: object

# IP geolocation service used for sessions and audit logs.
geo:
  # -- Deploy the geo service. When disabled, Appwrite skips geolocation.
  enabled: true
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: appwrite/geo
    # -- Image tag.
    tag: 0.3.2
    # -- Image digest.
    digest: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
  # -- Number of replicas.
  replicaCount: 1 # @schema minimum: 0
  # -- Resource requests and limits.
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Pod security context. The geo server listens on port 80, so the
  # unprivileged port range is lowered for the pod instead of running as root.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 82
    runAsGroup: 82
    seccompProfile:
      type: RuntimeDefault
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"
  # -- Container security context.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  # -- Pod annotations, merged over `defaults.podAnnotations`.
  podAnnotations: {} # @schema additionalProperties: {type: string}
  # -- Pod labels, merged over `defaults.podLabels`.
