  # -- Existing Secret holding the password.
  existingSecret: ""
  # -- Key in the Secret holding the password.
  passwordKey: clickhouse-password

# Storage for uploads, functions, sites, builds, certificates and imports
# (`/storage/*`).
persistence:
  # -- Persist `/storage` in a PersistentVolumeClaim. When disabled every pod
  # gets its own emptyDir, which only works with a single API and worker pod.
  enabled: true
  # -- Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  # -- Storage class. Empty uses the cluster default.
  storageClass: ""
  # -- Access modes. Use ReadWriteMany (or S3 storage) to spread API and
  # worker pods across nodes.
  accessModes: [ReadWriteOnce] # @schema item: string
  # -- Volume size.
  size: 20Gi
  # -- Annotations for the PersistentVolumeClaim.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Keep the PersistentVolumeClaim when the release is uninstalled.
  keep: true
  # -- With a ReadWriteOnce volume, schedule every pod that mounts it on the
  # same node so the volume can be attached.
  colocateReadWriteOnce: true

# Ingress resources for the routes Appwrite's Docker install serves through
# Traefik. See docs/networking.md for controller-specific settings.
ingress:
  # -- Create Ingress resources.
  enabled: false
  # -- IngressClass to use. Empty uses the cluster default.
  className: ""
  # -- Annotations for every Ingress, e.g. a cert-manager issuer.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Labels for every Ingress.
  labels: {} # @schema additionalProperties: {type: string}
  tls:
    # -- Terminate TLS for `appwrite.domain` and `appwrite.consoleDomain`.
    enabled: false
    # -- Secret with the certificate. Defaults to `<release>-tls`.
    secretName: ""
  wildcard:
    # -- Route `*.<functionsDomain>` and `*.<sitesDomain>` (function and site preview URLs) to the API.
    enabled: true
    # -- Annotations for the wildcard Ingress, merged over `ingress.annotations`.
    annotations: {} # @schema additionalProperties: {type: string}
    tls:
      # -- Terminate TLS for the wildcard hosts. Needs a wildcard certificate, which ACME issues through DNS-01.
      enabled: false
      # -- Secret with the wildcard certificate. Defaults to `<release>-wildcard-tls`.
      secretName: ""
  customDomains:
    # -- Route every other hostname to the API, for custom domains of
    # projects, functions and sites. Creates an Ingress rule without a host.
    enabled: false
    # -- Annotations for the custom-domain Ingress, merged over `ingress.annotations`.
    annotations: {} # @schema additionalProperties: {type: string}

# Gateway API HTTPRoutes for the same routes as `ingress`.
httpRoute:
  # -- Create HTTPRoutes (gateway.networking.k8s.io/v1).
  enabled: false
  # -- Gateways (and listeners) to attach to. Required when enabled.
  parentRefs: [] # @schema item: object
  # -- Annotations for every HTTPRoute.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Labels for every HTTPRoute.
  labels: {} # @schema additionalProperties: {type: string}
  # -- Send requests that carry an `x-appwrite-hostname` header to the API
  # instead of the console, as Appwrite's Traefik setup does. Uses a
  # RegularExpression header match, which not every Gateway implements.
  hostnameHeaderMatch: false
  wildcard:
    # -- Route `*.<functionsDomain>` and `*.<sitesDomain>` to the API.
    enabled: true
    # -- Gateways to attach the wildcard route to. Defaults to `httpRoute.parentRefs`.
    parentRefs: [] # @schema item: object
  customDomains:
    # -- Route every hostname the Gateway listener accepts to the API, for custom domains.
    enabled: false
    # -- Gateways (typically a dedicated catch-all listener) to attach the route to. Defaults to `httpRoute.parentRefs`.
    parentRefs: [] # @schema item: object

networkPolicy:
  # -- Create NetworkPolicies. They only take effect with a CNI that enforces them.
  enabled: false
  ingress:
    # -- Sources (NetworkPolicyPeer) allowed to reach the API, console and
    # realtime, typically your ingress controller or Gateway. Empty allows any
    # source. Pods of this release can always reach them.
    from: [] # @schema item: object
  egress:
    # -- Restrict egress to DNS, pods of this release and `extraRules`. Off by
    # default: Appwrite calls webhooks, SMTP servers, OAuth providers, the
    # executor and other external services.
    enabled: false
    # -- DNS servers to allow (NetworkPolicyPeer) when egress is restricted.
    dns:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # -- Extra egress rules (NetworkPolicyEgressRule) when egress is restricted.
    extraRules: [] # @schema item: object

tests:
  # -- Render `helm test` pods.
  enabled: true
