    # datastore with `metrics.enabled`. Needs the Prometheus Operator CRDs.
    enabled: false
    # -- Extra labels, e.g. the selector of your Prometheus.
    labels: {} # @schema additionalProperties: {type: string}
    # -- Scrape interval. Empty uses Prometheus' default.
    interval: ""
    # -- Scrape timeout. Empty uses Prometheus' default.
    scrapeTimeout: ""
  prometheusRule:
    # -- Create a PrometheusRule with `groups`. Needs the Prometheus Operator CRDs.
    enabled: false
    # -- Extra labels, e.g. the selector of your Prometheus.
    labels: {} # @schema additionalProperties: {type: string}
    # -- Rule groups (PrometheusRule `spec.groups`).
    groups: [] # @schema item: object

# Ingress resources for the routes Appwrite's Docker install serves through
# Traefik. See docs/networking.md for TLS, wildcard previews and custom domains.
ingress:
  # -- Create Ingress resources.
  enabled: false
  # -- IngressClass to use. Empty uses the cluster default.
  className: ""
  # -- Annotations for every Ingress, e.g. a cert-manager issuer.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Labels for every Ingress.
  labels: {} # @schema additionalProperties: {type: string}
  tls:
    # -- Terminate TLS for `appwrite.domain` and `appwrite.consoleDomain`.
    enabled: false
    # -- Secret with the certificate. Defaults to `<fullname>-tls`.
    secretName: ""
  wildcard:
    # -- Route `*.<functionsDomain>` and `*.<sitesDomain>` (function and site preview URLs) to the API.
    enabled: true
    # -- Annotations for the wildcard Ingress, merged over `ingress.annotations`.
    annotations: {} # @schema additionalProperties: {type: string}
    tls:
      # -- Terminate TLS for the wildcard hosts. Needs a wildcard certificate, which ACME issues through DNS-01.
      enabled: false
      # -- Secret with the wildcard certificate. Defaults to `<fullname>-wildcard-tls`.
      secretName: ""
  customDomains:
    # -- Route every other hostname to the API, for custom domains of
    # projects, functions and sites. Creates an Ingress rule without a host.
    enabled: false
    # -- Annotations for the custom-domain Ingress, merged over `ingress.annotations`.
    annotations: {} # @schema additionalProperties: {type: string}
  # -- `pathType` of every Ingress path. Some controllers (GCE) need
  # `ImplementationSpecific` for prefix matching.
  pathType: Prefix # @schema enum: [Prefix, ImplementationSpecific, Exact]
  # -- Extra `spec.tls` entries for the main Ingress, e.g. a certificate that
  # covers more hosts.
  extraTls: [] # @schema item: object

# Gateway API HTTPRoutes for the same routes as `ingress`. See
# docs/networking.md#gateway-api.
httpRoute:
  # -- Create HTTPRoutes (gateway.networking.k8s.io/v1).
  enabled: false
  # -- Gateways (and listeners) to attach to. Required when enabled.
  parentRefs: [] # @schema item: object
  # -- Annotations for every HTTPRoute.
  annotations: {} # @schema additionalProperties: {type: string}
  # -- Labels for every HTTPRoute.
  labels: {} # @schema additionalProperties: {type: string}
  # -- Send requests that carry an `x-appwrite-hostname` header to the API
  # instead of the console, as Appwrite's Traefik setup does. Uses a
  # RegularExpression header match, which not every Gateway implements.
  hostnameHeaderMatch: false
  # -- Timeouts (HTTPRouteTimeouts: `request`, `backendRequest`) for every
  # rule. Synchronous function executions can take up to 60s on function and
  # site domains, longer than some Gateways allow by default.
  timeouts: {} # @schema additionalProperties: {type: string}
  wildcard:
    # -- Route `*.<functionsDomain>` and `*.<sitesDomain>` to the API.
    enabled: true
    # -- Gateways to attach the wildcard route to. Defaults to `httpRoute.parentRefs`.
    parentRefs: [] # @schema item: object
  customDomains:
    # -- Route every hostname the Gateway listener accepts to the API, for custom domains.
    enabled: false
    # -- Gateways (typically a dedicated catch-all listener) to attach the route to. Defaults to `httpRoute.parentRefs`.
    parentRefs: [] # @schema item: object

# NetworkPolicies for the release namespace. The executor and build
# namespaces have their own, on by default (`compute.executor.networkPolicy`,
# `compute.builds.networkPolicy`). See docs/security.md#network-policies.
networkPolicy:
  # -- Create NetworkPolicies in the release namespace. The built-in
  # datastores then accept only Appwrite pods of this release, the internal
  # services (geo, browser, autogravity, embedding) only pods of
  # this release, and workers and tasks no incoming traffic. Off by default:
  # any pod in the cluster can reach the built-in PostgreSQL, Redis and
  # ClickHouse, which only their passwords protect. Policies only take effect
  # with a CNI that enforces them.
  enabled: false
  ingress:
    # -- Sources (NetworkPolicyPeer) allowed to reach the API, console,
    # realtime and MQTT, typically your ingress controller or Gateway. Empty
    # allows any source. Pods of this release can always reach the API,
    # console and realtime.
    from: [] # @schema item: object
  metrics:
    # -- Sources (NetworkPolicyPeer), typically Prometheus, allowed to scrape
    # the datastores' metrics ports (`<service>.builtin.metrics.enabled`). Empty
    # allows none.
    from: [] # @schema item: object
  egress:
    # -- Restrict egress to DNS, pods of this release and `extraRules` (needs
    # `networkPolicy.enabled`). Off by default: Appwrite calls webhooks, SMTP servers, OAuth providers, S3, and
    # the DNS server it verifies custom domains, migration sources and avatar
    # URLs against (`_APP_DNS` and `_APP_DNS_EXTERNAL`, 8.8.8.8).
    # With compute, the orchestrator also needs the Kubernetes API. Allow what
    # you use in `extraRules`; the executor is allowed already.
    enabled: false
    # -- DNS servers (NetworkPolicyPeer) allowed on port 53 wherever egress is
    # restricted: here, for the browser, and for the executor and build Jobs,
    # whose policies are on by default with compute. For NodeLocal DNSCache,
    # add `{ipBlock: {cidr: 169.254.20.10/32}}`. DNS on another port
    # (OpenShift: 5353) needs rules in `extraRules`,
    # `compute.executor.networkPolicy.extraEgress` and
    # `compute.builds.networkPolicy.extraEgress`.
    dns:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # -- Extra egress rules (NetworkPolicyEgressRule) when egress is restricted.
    extraRules: [] # @schema item: object

# Appwrite's data migration (`php app/cli.php migrate`), which must run after
# Appwrite is upgraded to a new version. Fresh installs don't need it. See
# docs/upgrading.md, and docs/gitops.md#migrations for Argo CD and Flux.
migrations:
  # -- How to run it. `hook`: a Helm post-upgrade hook, when the Appwrite
  # version changes or the previous hook failed. `job`: a regular Job named
  # after the version and a hash of its spec, for tools that don't run Helm
  # hooks (Argo CD). `none`: run it yourself.
  mode: hook # @schema enum: [hook, job, none]
  # -- Allow upgrading to an older Appwrite version than the one installed.
  # Appwrite can't migrate data backwards; restore a backup instead.
  allowDowngrade: false
  # -- Seconds the migration may run before it's stopped.
  activeDeadlineSeconds: 7200 # @schema minimum: 60
  # -- Retries after a failure.
  backoffLimit: 1 # @schema minimum: 0
  # -- Resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tests:
  # -- Render the `helm test` pods, which check that the API, console and
  # realtime respond.
  enabled: true
