name: Release

# Publishes the chart to ghcr.io/levivannoort/charts/appwrite when its version
# changes on main: OCI push, keyless cosign signature, build provenance
# attestation, GitHub release and Artifact Hub metadata.
on:
  push:
    branches: [main]
    paths:
      - charts/appwrite/Chart.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository_owner }}/charts
  CHART: appwrite
  COSIGN_VERSION: v3.1.3
  ORAS_VERSION: 1.3.4

jobs:
  release:
    # Publishing signs the chart in the public Rekor log and needs public
    # packages for attestations: only release once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub release
      packages: write       # push to GHCR
      id-token: write       # keyless signing and attestations
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Read the chart version
        id: chart
        run: |
          version=$(yq '.version' "charts/${CHART}/Chart.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${REPOSITORY}/${CHART}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Skip versions that are already published
        id: published
        run: |
          if helm show chart "oci://${{ steps.chart.outputs.ref }}" --version "${{ steps.chart.outputs.version }}" >/dev/null 2>&1; then
            echo "Version ${{ steps.chart.outputs.version }} is already published."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        id: push
        if: steps.published.outputs.exists == 'false'
        run: |
          helm package "charts/${CHART}" --destination dist
          output=$(helm push "dist/${CHART}-${{ steps.chart.outputs.version }}.tgz" "oci://${REGISTRY}/${REPOSITORY}" 2>&1)
          echo "$output"
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' <<<"$output" | head -1)
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.published.outputs.exists == 'false'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign with cosign (keyless)
        if: steps.published.outputs.exists == 'false'
        env:
          COSIGN_YES: "true"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          cosign sign "${{ steps.chart.outputs.ref }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        if: steps.published.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.chart.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub release
        if: steps.published.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```console'
            echo "helm install appwrite oci://${{ steps.chart.outputs.ref }} --version ${VERSION}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> notes.md
          flags=()
          # Pre-1.0 and pre-release versions are marked as pre-releases.
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${CHART}-${VERSION}" "dist/${CHART}-${VERSION}.tgz" \
            --title "${CHART} ${VERSION}" --notes-file notes.md "${flags[@]}"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: steps.published.outputs.exists == 'false'
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Publish Artifact Hub metadata
        if: steps.published.outputs.exists == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          oras push "${{ steps.chart.outputs.ref }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
