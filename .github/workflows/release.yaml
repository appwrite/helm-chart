name: Release

# Publishes the chart to ghcr.io/appwrite/charts/appwrite when its version
# changes on main: OCI push, keyless cosign signature, build provenance
# attestation, GitHub release and Artifact Hub metadata.
#
# Every step checks before it acts, so a re-run finishes a release that
# failed half-way: the chart is pushed only if the registry says the version
# doesn't exist, and the signature, attestation and GitHub release are only
# created when they're missing.
on:
  push:
    branches: [main]
    paths:
      - charts/appwrite/Chart.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository_owner }}/charts
  CHART: appwrite
  COSIGN_VERSION: v3.1.4
  ORAS_VERSION: 1.3.6
  # The signer docs/security.md tells users to verify against.
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/heads/main
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    # Only main publishes (a manual run from another branch does nothing).
    # Publishing signs the chart in the public Rekor log and needs public
    # packages for attestations: only release once the repository is public.
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub release
      packages: write       # push to GHCR
      id-token: write       # keyless signing and attestations
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Read the chart version
        id: chart
        run: |
          version=$(yq '.version' "charts/${CHART}/Chart.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${REPOSITORY}/${CHART}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > "${RUNNER_TEMP}/changelog.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/changelog.md"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no entries under \"## [${VERSION}]\": rename [Unreleased] to [${VERSION}] before releasing (see RELEASING.md)."
            exit 1
          fi
          cat "${RUNNER_TEMP}/changelog.md"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | helm registry login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Look the version up in the registry
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          # Only a 404 means "not published": any other answer fails the job
          # rather than pushing the version again.
          token=$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${REPOSITORY}/${CHART}:pull" | jq -er .token)
          status=$(curl -sS --head -o /dev/null -D "${RUNNER_TEMP}/headers" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://${REGISTRY}/v2/${REPOSITORY}/${CHART}/manifests/${VERSION}")
          case "$status" in
            200)
              digest=$(tr -d '\r' < "${RUNNER_TEMP}/headers" | awk 'tolower($1) == "docker-content-digest:" {print $2}')
              echo "Version ${VERSION} is already published (${digest}): finishing any missing steps."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Version ${VERSION} isn't published yet."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} looking up ${CHART}:${VERSION} in ${REGISTRY}."
              exit 1
              ;;
          esac

      - name: Package and push
        id: push
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "charts/${CHART}" --destination dist
          output=$(helm push "dist/${CHART}-${VERSION}.tgz" "oci://${REGISTRY}/${REPOSITORY}" 2>&1)
          echo "$output"
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' <<<"$output" | head -1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Resolve the digest
        id: digest
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.published.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::No chart digest (got '${DIGEST}')."; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Pull the published chart
        env:
          REF: ${{ steps.chart.outputs.ref }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          helm pull "oci://${REF}" --version "${VERSION}" --destination "${RUNNER_TEMP}/release"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign with cosign (keyless) unless already signed
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.chart.outputs.ref }}@${{ steps.digest.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | cosign login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
          if cosign verify "$SUBJECT" --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" >/dev/null 2>&1; then
            echo "Already signed by this workflow."
          else
            cosign sign --yes "$SUBJECT"
          fi

      - name: Verify the signature
        env:
          REF: ${{ steps.chart.outputs.ref }}
          VERSION: ${{ steps.chart.outputs.version }}
        # The same command docs/security.md gives users.
        run: |
          cosign verify "${REF}:${VERSION}" --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" >/dev/null
          echo "Signature verified for ${CERT_IDENTITY}."

      - name: Look for a provenance attestation
        id: attested
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.chart.outputs.ref }}@${{ steps.digest.outputs.digest }}
        run: |
          if gh attestation verify "oci://${SUBJECT}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already attested."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: steps.attested.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.chart.outputs.ref }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.chart.outputs.ref }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: gh attestation verify "oci://${REF}:${VERSION}" --repo "$GITHUB_REPOSITORY"

      - name: Create the GitHub release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.chart.outputs.ref }}
          VERSION: ${{ steps.chart.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          tag="${CHART}-${VERSION}"
          asset="${RUNNER_TEMP}/release/${CHART}-${VERSION}.tgz"
          if out=$(gh release view "$tag" --json tagName 2>&1); then
            echo "Release ${tag} exists; making sure it has the chart archive."
            gh release upload "$tag" "$asset" --clobber
            exit 0
          elif [[ "$out" != *"release not found"* ]]; then
            echo "$out"
            exit 1
          fi
          {
            cat "${RUNNER_TEMP}/changelog.md"
            echo
            echo "## Install"
            echo
            echo '```console'
            echo "helm install appwrite oci://${REF} --version ${VERSION}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } > "${RUNNER_TEMP}/notes.md"
          flags=()
          # Pre-1.0 and pre-release versions are marked as pre-releases.
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
            --title "${CHART} ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Publish Artifact Hub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.chart.outputs.ref }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
          oras push "${REF}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
