name: Install

on:
  pull_request:
    paths:
      - charts/**
      - hack/**
      - .github/workflows/test-install.yaml
  push:
    branches: [main]
    paths:
      - charts/**
      - hack/**
      - .github/workflows/test-install.yaml

permissions:
  contents: read

env:
  GATEWAY_API_VERSION: v1.6.2
  TRAEFIK_CHART_VERSION: 41.6.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.scenario }} (k8s ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported Kubernetes for the default install.
          - scenario: default
            kubernetes: v1.29.14
          - scenario: default
            kubernetes: v1.37.0
          # NetworkPolicies on, egress restricted. kindnet enforces policies.
          - scenario: hardened
            kubernetes: v1.37.0
          - scenario: separate-workers
            kubernetes: v1.37.0
          - scenario: grouped-workers
            kubernetes: v1.37.0
          # PostgreSQL, Redis and ClickHouse outside the release.
          - scenario: external-dbs
            kubernetes: v1.37.0
            external-dbs: true
          # Routing through Traefik, as an Ingress controller and as a Gateway.
          - scenario: ingress
            kubernetes: v1.37.0
            traefik: true
          - scenario: gateway-api
            kubernetes: v1.37.0
            traefik: true
            routes-args: --header-match
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: appwrite
          node_image: kindest/node:${{ matrix.kubernetes }}
          config: hack/kind-config.yaml
      - name: Install Traefik and the Gateway API CRDs
        if: matrix.traefik
        run: |
          kubectl apply --server-side -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          helm upgrade --install traefik traefik --repo https://traefik.github.io/charts --version "${TRAEFIK_CHART_VERSION}" \
            -n traefik --create-namespace -f hack/fixtures/traefik-values.yaml --wait --timeout 5m
      - name: Install external datastores
        if: matrix.external-dbs
        run: |
          kubectl apply -f hack/fixtures/external-dbs.yaml
          hack/fixtures/external-dbs-secrets.sh appwrite
          kubectl -n external-dbs rollout status statefulset/postgres --timeout=5m
          kubectl -n external-dbs rollout status deployment/redis --timeout=5m
          kubectl -n external-dbs rollout status deployment/clickhouse --timeout=5m
      - name: Install
        run: make install VALUES=charts/appwrite/ci/${{ matrix.scenario }}-values.yaml
      - name: helm test
        run: make helm-test
      - name: Smoke test
        run: make smoke
      - name: Routes
        if: matrix.traefik
        run: hack/routes.sh appwrite.ci.local traefik traefik ${{ matrix.routes-args }}
      - name: Upgrade without changes keeps credentials and pods
        run: |
          before=$(kubectl -n appwrite get secret appwrite -o jsonpath='{.data._APP_OPENSSL_KEY_V1}')
          pods=$(kubectl -n appwrite get pods -o name | sort)
          make install VALUES=charts/appwrite/ci/${{ matrix.scenario }}-values.yaml
          after=$(kubectl -n appwrite get secret appwrite -o jsonpath='{.data._APP_OPENSSL_KEY_V1}')
          test "$before" = "$after"
          test "$pods" = "$(kubectl -n appwrite get pods -o name | sort)"
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n appwrite get all,pvc,events -o wide || true
          for pod in $(kubectl -n appwrite get pods -o name); do
            echo "::group::$pod"
            kubectl -n appwrite describe "$pod" || true
            kubectl -n appwrite logs "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
