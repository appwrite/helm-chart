name: Nightly end-to-end

# Functions built and executed in the cluster (the executor on
# Docker-in-Docker), with every optional component, which takes longer than
# PR checks should.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GATEWAY_API_VERSION: v1.6.2
  TRAEFIK_CHART_VERSION: 41.6.1

jobs:
  functions:
    name: Functions and optional components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: appwrite
          node_image: kindest/node:v1.37.0
          config: hack/kind-config.yaml
      - name: Answer the runner's search domains in CoreDNS
        run: hack/ci-dns.sh appwrite
      - name: Install Traefik
        run: |
          kubectl apply --server-side -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          helm upgrade --install traefik traefik --repo https://traefik.github.io/charts --version "${TRAEFIK_CHART_VERSION}" \
            -n traefik --create-namespace -f hack/fixtures/traefik-values.yaml --wait --timeout 5m
      - name: Start the compute plane
        run: hack/compute-plane.sh "${RUNNER_TEMP}/compute-values.yaml"
      - name: Install with every optional component
        run: make install VALUES="charts/appwrite/ci/full-values.yaml ${RUNNER_TEMP}/compute-values.yaml"
      - name: helm test
        run: make helm-test
      - name: Smoke test (includes a screenshot through the browser service)
        run: make smoke
      - name: Functions
        run: hack/functions-smoke.sh appwrite appwrite node-22
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n appwrite get all,events -o wide || true
          for pod in $(kubectl -n appwrite get pods -o name); do
            echo "::group::$pod"
            kubectl -n appwrite logs "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
          echo "::group::builds namespace"
          kubectl -n appwrite-builds get jobs,pods,networkpolicies,events -o wide || true
          for pod in $(kubectl -n appwrite-builds get pods -o name); do
            kubectl -n appwrite-builds describe "$pod" || true
            kubectl -n appwrite-builds logs "$pod" --all-containers --prefix --tail=200 || true
          done
          echo "::endgroup::"
          echo "::group::executor namespace"
          kubectl -n appwrite-executor get pods,networkpolicies,events -o wide || true
          kubectl -n appwrite-executor logs deploy/appwrite-executor --all-containers --prefix --tail=200 || true
          kubectl -n appwrite-executor exec deploy/appwrite-executor -c dind -- docker ps -a || true
          echo "::endgroup::"
          echo "::group::aw-s3"
          docker logs aw-s3 --tail=200 || true
          echo "::endgroup::"
