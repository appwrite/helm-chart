name: Lint and test

on:
  pull_request:
    # labeled/unlabeled re-run the changelog check when skip-changelog changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_UNITTEST_VERSION: v1.2.1
  HELM_SCHEMA_VERSION: v2.6.0
  HELM_DOCS_VERSION: 1.14.2
  KUBECONFORM_VERSION: v0.8.0

jobs:
  lint:
    name: Lint (Helm ${{ matrix.helm }})
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-lint-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Helm 3 release and the current Helm 4 release.
        helm: [v3.18.6, v4.3.0]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: ct lint
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --config ct.yaml --target-branch "${TARGET_BRANCH}"
      - name: helm lint --strict (every ci/ scenario)
        run: |
          for f in charts/appwrite/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint --strict charts/appwrite -f "$f"
            echo "::endgroup::"
          done

  unittest:
    name: Unit tests (Helm ${{ matrix.helm }})
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-unittest-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.18.6, v4.3.0]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Install helm-unittest
        run: |
          # Helm 4 installs the signed release archive; Helm 3 only installs from git.
          if helm version --short | grep -q '^v4'; then
            v="${HELM_UNITTEST_VERSION#v}"
            helm plugin install "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/unittest-${v}.tgz" --verify=false
          else
            helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"
          fi
      - name: helm unittest
        run: helm unittest --strict --output-type JUnit --output-file test-results/unittest.xml charts/appwrite
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        # The JUnit report is a convenience: a full artifact quota (shared by
        # the organisation) must not fail a job whose tests passed.
        continue-on-error: true
        with:
          name: unittest-results-${{ matrix.helm }}
          path: test-results/
          retention-days: 7

  kubeconform:
    name: kubeconform
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-kubeconform-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Validate rendered manifests
        run: make kubeconform
      - name: Validate examples/
        run: make examples

  generated:
    name: Generated files are up to date
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-generated-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install helm-docs and helm-values-schema-json
        run: |
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helm-docs
          helm plugin install https://github.com/losisin/helm-values-schema-json --version "${HELM_SCHEMA_VERSION}" --verify=false
      - name: Check values.schema.json and README.md
        run: make check-generated

  metadata:
    name: Chart metadata
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-metadata-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: artifacthub.io/images matches values.yaml
        run: hack/chart-images.sh --check
      - name: Every Appwrite version named matches appVersion
        run: make check-versions

  artifacthub:
    name: Artifact Hub lint
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-artifacthub-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    env:
      # Run from the image, pinned by digest, with the runner's own uid: as a
      # job container, its user has to match the runner's to write the
      # runner's files, and that uid differs between runners.
      AH_IMAGE: docker.io/artifacthub/ah:v1.23.0@sha256:e5d2a2cdef85aac4928e8176ffaad24746c5fe961d64ff6856f7222957095356
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ah lint
        run: docker run --rm -u "$(id -u):$(id -g)" -v "${GITHUB_WORKSPACE}/charts:/charts:ro" -w /charts "$AH_IMAGE" ah lint

  changelog:
    name: Changelog
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-changelog-{1}/machine=c3d-standard-4', github.run_id, strategy.job-index)
      || 'ubuntu-latest' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
          persist-credentials: false
      - name: CHANGELOG.md has an entry for chart changes
        if: github.event_name == 'pull_request'
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if ! grep -q '^charts/appwrite/' <<<"$changed"; then
            echo "No changes to charts/appwrite/."
          elif grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md is updated."
          elif [[ "$SKIP" == true ]]; then
            echo "::notice::No CHANGELOG.md entry: the pull request is labelled skip-changelog."
          else
            echo "::error file=CHANGELOG.md::This pull request changes charts/appwrite/ but not CHANGELOG.md. Add an entry under [Unreleased], or label the pull request skip-changelog if users won't notice the change."
            exit 1
          fi
      - name: artifacthub.io/changes matches CHANGELOG.md
        run: make check-changes
