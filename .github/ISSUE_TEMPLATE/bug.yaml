name: Bug report
description: Something in the chart doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: chart-version
    attributes:
      label: Chart version
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kubernetes and Helm versions
      placeholder: Kubernetes 1.32, Helm 4.3.0
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Values
      description: The values you installed with. Remove secrets.
      render: yaml
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
