name: Bug report
description: Something in the chart doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: chart-version
    attributes:
      label: Chart version
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kubernetes and Helm versions
      placeholder: Kubernetes 1.32, Helm 4.3.0
    validations:
      required: true
  - type: checkboxes
    id: external
    attributes:
      label: Services outside the release
      description: Tick what you run yourself instead of the chart's built-in services.
      options:
        - label: PostgreSQL, MariaDB, MySQL or MongoDB
        - label: Redis
        - label: ClickHouse
        - label: S3 storage
  - type: input
    id: providers
    attributes:
      label: Providers
      description: Which managed services, if any.
      placeholder: RDS for PostgreSQL 17, ElastiCache for Valkey, Cloudflare R2
  - type: textarea
    id: values
    attributes:
      label: Values
      description: The values you installed with. Remove secrets.
      render: yaml
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
