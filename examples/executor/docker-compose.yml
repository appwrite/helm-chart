# The executor for Appwrite's Functions and Sites on a Kubernetes install, for
# when it shouldn't run in the cluster (compute.executor.mode: external).
#
# Run this on a Docker host that the Appwrite pods can reach over a private
# network. The executor runs function and site runtimes as containers through
# the host's Docker socket.
# Builds run in the cluster as Kubernetes Jobs; to run them here instead, see
# external-builds.yml. The executor reads build output from the S3 bucket
# Appwrite uses (appwrite.storage.device: s3).
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# Then set in the chart:
#   compute.enabled: true
#   compute.executor.mode: external
#   compute.executor.host: http://<this-host>:${EXECUTOR_PORT}/v1
# and use the same executor secret (compute.secrets).

name: appwrite-executor

services:
  executor:
    image: openruntimes/executor:0.29.0
    # The executor finds its own container by hostname.
    hostname: appwrite-executor
    container_name: appwrite-executor
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      - "${EXECUTOR_PORT:-9900}:80"
    networks:
      - runtimes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Runtimes are started with bind mounts under /tmp, so the paths must be
      # the same inside the executor and on the host.
      - /tmp:/tmp:rw
    environment:
      OPR_EXECUTOR_ENV: production
      OPR_EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET to the chart's executor secret}
      OPR_EXECUTOR_NETWORK: appwrite-runtimes
      OPR_EXECUTOR_RUNTIMES: ${RUNTIMES:-node-22,static-1}
      OPR_EXECUTOR_RUNTIME_VERSIONS: v5
      # Images to pre-pull, e.g. openruntimes/node:v5-22,openruntimes/static:v5-1
      OPR_EXECUTOR_IMAGES: ${RUNTIME_IMAGES:-}
      OPR_EXECUTOR_INACTIVE_THRESHOLD: ${INACTIVE_THRESHOLD:-60}
      OPR_EXECUTOR_MAINTENANCE_INTERVAL: "3600"
      OPR_EXECUTOR_DOCKER_HUB_USERNAME: ${DOCKER_HUB_USERNAME:-}
      OPR_EXECUTOR_DOCKER_HUB_PASSWORD: ${DOCKER_HUB_PASSWORD:-}
      # Appwrite stores build paths with the bucket as their first segment when
      # an S3 endpoint is set, so the DSN names the endpoint but not the bucket.
      # AWS S3 (no endpoint configured in Appwrite) instead uses
      # s3://KEY:SECRET@BUCKET.s3.REGION.amazonaws.com?region=REGION
      OPR_EXECUTOR_CONNECTION_STORAGE: ${EXECUTOR_STORAGE_DSN:?set EXECUTOR_STORAGE_DSN, e.g. s3://KEY:SECRET@s3.example.com?region=us-east-1}
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://localhost/v1/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  runtimes:
    # Fixed name: the executor attaches the runtime containers it creates to
    # it by this name.
    name: appwrite-runtimes
