# Builds on this Docker host instead of in the cluster, for
# compute.orchestrator.mode=external. Most installs don't need this: by
# default the chart runs the orchestrator and every build is a Kubernetes Job.
#
# The orchestrator needs root and the host's Docker socket. Write the chart's
# orchestrator secret to ./orchestrator-api-key (no trailing newline):
#
#   kubectl -n appwrite get secret appwrite \
#     -o jsonpath='{.data.orchestrator-secret}' | base64 -d > orchestrator-api-key
#
# Add the bucket Appwrite uses to .env:
#
#   S3_ENDPOINT=https://s3.example.com   # empty for AWS S3
#   S3_REGION=us-east-1
#   S3_ACCESS_KEY=...
#   S3_SECRET_KEY=...
#   ORCHESTRATOR_PORT=8080               # optional
#
# Then start it together with the executor:
#
#   docker compose -f docker-compose.yml -f external-builds.yml up -d
#
# and set in the chart:
#   compute.orchestrator.mode: external
#   compute.orchestrator.host: http://<this-host>:${ORCHESTRATOR_PORT}

services:
  orchestrator:
    image: ghcr.io/open-runtimes/orchestrator/orchestrator:2.2.2
    container_name: appwrite-orchestrator
    restart: unless-stopped
    # Needs root to open the Docker socket.
    user: "0"
    stop_grace_period: 60s
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    networks:
      - runtimes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestrator-api-key:/run/secrets/api-key:ro
    environment:
      ORCHESTRATOR_BACKEND: docker
      ORCHESTRATOR_NETWORK: appwrite-runtimes
      DOCKER_NETWORK: appwrite-runtimes
      ARTIFACT_ENDPOINT: http://appwrite-orchestrator:8080
      # Requests must carry the chart's orchestrator secret as a bearer token.
      API_KEY_FILE: /run/secrets/api-key
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY to Appwrite's S3 access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY to Appwrite's S3 secret key}
    healthcheck:
      test: ["CMD", "/ko-app/orchestrator", "-check-ready"]
      interval: 10s
      timeout: 3s
      retries: 10
