# Appwrite on GKE with Google Cloud services: Cloud SQL for PostgreSQL,
# Memorystore for Redis, Cloud Storage, Filestore for /storage, ClickHouse
# Cloud, and an SMTP provider for email. Layer it over minimal.yaml, or over
# production.yaml to replace that file's datastores:
#
#   helm install appwrite oci://ghcr.io/appwrite/charts/appwrite \
#     --namespace appwrite \
#     -f minimal.yaml -f gcp.yaml --wait --timeout 15m
#
# For Functions and Sites, add functions-existing-secrets.yaml. The executor
# needs a GKE Standard cluster: Autopilot blocks privileged containers.
#
# Before installing:
#
# - Cloud SQL for PostgreSQL with a private IP in the cluster's VPC. Create
#   the appwrite user and database (docs/external-databases.md#requirements);
#   users created through Cloud SQL can create the extensions. Connect as
#   appwrite once and run
#     CREATE EXTENSION postgis; CREATE EXTENSION vector; CREATE EXTENSION pg_trgm;
#   "Allow only SSL connections" can stay on: Appwrite connects with TLS when
#   offered.
# - Memorystore for Redis (not Redis Cluster), Standard tier for a replica
#   with automatic failover, with in-transit encryption off (Appwrite 2.6.2
#   has no Redis TLS). AUTH can stay on: its AUTH string goes in the Secret.
# - A Cloud Storage bucket, and an HMAC key (Cloud Storage > Settings >
#   Interoperability) for a service account with Storage Object Admin on the
#   bucket. Appwrite doesn't support GKE Workload Identity.
# - An SMTP provider and a domain verified with it. Google Cloud has no SMTP
#   service of its own and blocks port 25, so use 587. Here SendGrid; others
#   are in docs/integrations.md#email-smtp.
# - A ClickHouse Cloud service whose IP access list includes the cluster's
#   egress addresses (Cloud NAT for private nodes), with a URL-safe password.
# - The Filestore CSI driver, turned on for the cluster. Its standard-rwx
#   StorageClass creates instances on the VPC named default; on another VPC,
#   create a class with the network parameter and name it below.
#
# Then create the namespace and the Secret. The key names are the chart's
# defaults:
#
#   kubectl create namespace appwrite
#   kubectl -n appwrite create secret generic appwrite-external \
#     --from-literal=db-password='...' \
#     --from-literal=redis-password='...' \
#     --from-literal=clickhouse-password='...' \
#     --from-literal=s3-access-key='GOOG...' \
#     --from-literal=s3-secret-key='...' \
#     --from-literal=smtp-password='SG....'
#
# Provider notes: docs/external-databases.md, docs/storage.md#s3,
# docs/integrations.md#email-smtp

database:
  mode: external
  name: appwrite
  username: appwrite
  connectionsMax: 400                 # see docs/external-databases.md#connections to size max_connections
  password:
    secretName: appwrite-external
    secretKey: db-password            # explicit: production.yaml uses another key
  external:
    host: 10.20.0.3                   # the instance's private IP

redis:
  mode: external
  password:
    secretName: appwrite-external     # the AUTH string; "" without AUTH
  external:
    host: 10.20.1.4                   # the instance's primary endpoint

clickhouse:
  mode: external
  database: appwrite
  username: appwrite
  password:
    secretName: appwrite-external
  external:
    url: https://abc123.europe-west4.gcp.clickhouse.cloud:8443

storage:
  device: s3
  s3:
    mode: external
    external:
      endpoint: https://storage.googleapis.com
      region: auto
    bucket: appwrite-example-com
    accessKeyId:
      secretName: appwrite-external   # s3-access-key: the HMAC key's access ID
    secretAccessKey:
      secretName: appwrite-external   # s3-secret-key: the HMAC key's secret
  volume:
    size: 1Ti                         # Filestore's smallest instance
    accessModes: [ReadWriteMany]      # Filestore lets the API and workers spread across nodes
    storageClass: standard-rwx

# The executor runs in a namespace of its own and can't read the S3 Secret
# above, so Functions and Sites stay off here: add
# functions-existing-secrets.yaml to turn them on.
compute:
  enabled: false

smtp:
  host: smtp.sendgrid.net
  port: 587
  secure: tls
  username: apikey                    # literally "apikey"; the password is the API key
  password:
    secretName: appwrite-external

appwrite:
  system:
    emailAddress: noreply@example.com # on a domain verified with the provider
