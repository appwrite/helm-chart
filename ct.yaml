# chart-testing configuration: https://github.com/helm/chart-testing
chart-dirs:
  - charts
target-branch: main
remote: origin
lint-conf: lintconf.yaml
validate-maintainers: false
# Disabled until 0.1.0 is released; until then every PR targets the same unreleased version.
check-version-increment: false
helm-extra-args: --timeout 900s
