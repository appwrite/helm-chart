# Front for the e2e runner, like Traefik in Appwrite's compose stack:
# http://localhost and http://appwrite.test go to the API, except
# /v1/realtime, which goes to realtime. hack/appwrite-e2e.sh fills in the
# Services.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 600s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 80;
    location /v1/realtime {
      proxy_pass http://REALTIME_SERVICE;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location / {
      proxy_pass http://API_SERVICE;
      proxy_set_header Host $http_host;
    }
  }
}
